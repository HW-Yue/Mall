name: nexus-apps

x-app-env: &app-env
  TZ: Asia/Shanghai
  JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -server -XX:+HeapDumpOnOutOfMemoryError}
  PARAMS: >-
    --spring.profiles.active=${SPRING_PROFILES_ACTIVE:-dev}
    --rocketmq.name-server=${ROCKETMQ_NAME_SERVER:-100.86.250.112:9876}

services:
  mall:
    image: nexus/mall-app:${IMAGE_TAG:-local}
    build:
      context: ./mall/mall-app
      dockerfile: Dockerfile
    container_name: nexus-mall
    environment:
      <<: *app-env
    ports:
      - "${MALL_PORT:-8077}:8077"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  order-service:
    image: nexus/order-service-app:${IMAGE_TAG:-local}
    build:
      context: ./order-service/order-service-app
      dockerfile: Dockerfile
    container_name: nexus-order-service
    environment:
      <<: *app-env
    ports:
      - "${ORDER_SERVICE_PORT:-8092}:8092"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  group-buy-service:
    image: nexus/group-buy-service-app:${IMAGE_TAG:-local}
    build:
      context: ./group-buy-service/group-buy-service-app
      dockerfile: Dockerfile
    container_name: nexus-group-buy-service
    environment:
      <<: *app-env
    ports:
      - "${GROUP_BUY_SERVICE_PORT:-8093}:8093"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  seckill-service:
    image: nexus/seckill-service-app:${IMAGE_TAG:-local}
    build:
      context: ./seckill-service/seckill-service-app
      dockerfile: Dockerfile
    container_name: nexus-seckill-service
    environment:
      <<: *app-env
    ports:
      - "${SECKILL_SERVICE_PORT:-8094}:8094"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pay:
    image: nexus/pay-app:${IMAGE_TAG:-local}
    build:
      context: ./pay/pay-app
      dockerfile: Dockerfile
    container_name: nexus-pay
    environment:
      <<: *app-env
    ports:
      - "${PAY_PORT:-8079}:8079"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway:
    image: nexus/springcloud-gateway:${IMAGE_TAG:-local}
    build:
      context: ./springcloud-gateway/app
      dockerfile: Dockerfile
    container_name: nexus-gateway
    environment:
      <<: *app-env
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
