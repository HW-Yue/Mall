name: nexus-apps

x-app-env: &app-env
  TZ: Asia/Shanghai
  JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -server -XX:+HeapDumpOnOutOfMemoryError}
  PARAMS: >-
    --spring.profiles.active=${SPRING_PROFILES_ACTIVE:-dev}
    --rocketmq.name-server=${ROCKETMQ_NAME_SERVER:-100.86.250.112:9876}

services:
  mall:
    image: nexus/mall-app:${IMAGE_TAG:-local}
    build:
      context: ./mall/mall-app
      dockerfile: Dockerfile
    container_name: nexus-mall
    environment:
      <<: *app-env
    ports:
      - "${MALL_PORT:-8077}:8077"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  order-service:
    image: nexus/order-service-app:${IMAGE_TAG:-local}
    build:
      context: ./order-service/order-service-app
      dockerfile: Dockerfile
    container_name: nexus-order-service
    environment:
      <<: *app-env
    ports:
      - "${ORDER_SERVICE_PORT:-8092}:8092"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  group-buy-service:
    image: nexus/group-buy-service-app:${IMAGE_TAG:-local}
    build:
      context: ./group-buy-service/group-buy-service-app
      dockerfile: Dockerfile
    container_name: nexus-group-buy-service
    environment:
      <<: *app-env
    ports:
      - "${GROUP_BUY_SERVICE_PORT:-8093}:8093"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  seckill-service:
    image: nexus/seckill-service-app:${IMAGE_TAG:-local}
    build:
      context: ./seckill-service/seckill-service-app
      dockerfile: Dockerfile
    container_name: nexus-seckill-service
    environment:
      <<: *app-env
    ports:
      - "${SECKILL_SERVICE_PORT:-8094}:8094"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pay:
    image: nexus/pay-app:${IMAGE_TAG:-local}
    build:
      context: ./pay/pay-app
      dockerfile: Dockerfile
    container_name: nexus-pay
    environment:
      <<: *app-env
    ports:
      - "${PAY_PORT:-8079}:8079"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway:
    image: nexus/springcloud-gateway:${IMAGE_TAG:-local}
    build:
      context: ./springcloud-gateway/app
      dockerfile: Dockerfile
    container_name: nexus-gateway
    environment:
      <<: *app-env
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ops-agent-spring-ai:
    image: nexus/ops-agent-spring-ai:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: ops-agent-spring-ai/Dockerfile
      additional_contexts:
        skywalking-agent: ${SKYWALKING_AGENT_CONTEXT:-/home/yue/tools/apache-skywalking-java-agent-9.6.0/skywalking-agent}
    container_name: nexus-ops-agent-spring-ai
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: >-
        ${OPS_AGENT_JAVA_OPTS:--Xms256m -Xmx512m -server -XX:+HeapDumpOnOutOfMemoryError
        -javaagent:/opt/skywalking/skywalking-agent/skywalking-agent.jar
        -Dskywalking.collector.backend_service=${SKYWALKING_BACKEND_SERVICE:-100.86.250.112:11800}
        -Dskywalking.agent.service_name=ops-agent-spring-ai
        -Dskywalking.trace.ignore_path=/actuator/**,*:/actuator/**,SpringScheduled/**,HikariCP/**,SpringCloudGateway/GatewayFilter,Mysql/JDBC/PreparedStatement/execute}
      PARAMS: >-
        --server.port=2322
        --spring.profiles.active=${SPRING_PROFILES_ACTIVE:-dev}
        --rocketmq.name-server=${ROCKETMQ_NAME_SERVER:-100.86.250.112:9876}
        --ops-ai.otlp.enabled=${OPS_AI_OTLP_ENABLED:-true}
        --ops-ai.otlp.endpoint=${OPS_AI_OTLP_ENDPOINT:-http://100.86.250.112:11800}
        --ops-ai.otlp.service-name=${OPS_AI_OTLP_SERVICE_NAME:-ops-agent-spring-ai}
    ports:
      - "${OPS_AGENT_PORT:-2322}:2322"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
