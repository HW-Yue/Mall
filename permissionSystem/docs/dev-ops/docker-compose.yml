version: '3'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333" # HTTP API 端口
      - "6334:6334" # gRPC API 端口 (LangChain4j 必须用这个)
    volumes:
      - ./qdrant_storage:/qdrant/storage # 数据持久化挂载
    environment:
      - QDRANT__SERVICE__API_KEY=123321 # 【重要】开启鉴权