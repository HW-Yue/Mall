# group-buy-service：RocketMQ 消费线程池动态配置
# 本地：由 application-dev.yml / application-test.yml 通过 spring.config.import classpath 加载。
# Nacos：发布为 DataId「group-buy-service-mq-dev.yml」、Group「DEFAULT_GROUP」。

app:
  rocketmq:
    consumer-thread-pool:
      consumers:
        CG_GROUP_BUY_ORDER_PAID:
          consume-thread-number: 20
          consume-thread-max: 64
        CG_GROUP_BUY_TIMEOUT_REFUND:
          consume-thread-number: 10
          consume-thread-max: 32
        CG_GROUP_BUY_PAY_REFUND:
          consume-thread-number: 10
          consume-thread-max: 32
        CG_GROUP_BUY_ORDER_CLOSE:
          consume-thread-number: 10
          consume-thread-max: 32
