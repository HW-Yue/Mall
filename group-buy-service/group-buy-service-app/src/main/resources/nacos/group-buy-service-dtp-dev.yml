# group-buy-service：DynamicTp 与 Tomcat 线程池配置
# 本地：由 application-dev.yml / application-test.yml 通过 spring.config.import classpath 加载。
# Nacos：发布为 DataId「group-buy-service-dtp-dev.yml」、Group「DEFAULT_GROUP」。

spring:
  dynamic:
    tp:
      enabled: true
      enabled-collect: true
      collector-types:
        - micrometer
        - internal_logging
      monitor-interval: 30
      executors:
        - thread-pool-name: threadPoolExecutor
          thread-pool-alias-name: group-buy-business
          executor-type: common
          core-pool-size: 5
          maximum-pool-size: 10
          queue-capacity: 100
          queue-type: LinkedBlockingQueue
          rejected-handler-type: CallerRunsPolicy
          keep-alive-time: 60
          thread-name-prefix: group-buy
          wait-for-tasks-to-complete-on-shutdown: true
          await-termination-seconds: 3
          task-wrapper-names:
            - mdc
          notify-enabled: false
      tomcat-tp:
        thread-pool-alias-name: group-buy-tomcat
        core-pool-size: 10
        maximum-pool-size: 20
        keep-alive-time: 60
        task-wrapper-names:
          - mdc
        notify-enabled: false
