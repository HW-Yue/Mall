name: nexus-apps

services:
  mall-frontend:
    image: nexus/mall-frontend:${IMAGE_TAG:-local}
    build:
      context: ../dev-ops/nginx
      dockerfile: Dockerfile
    container_name: nexus-mall-frontend
    ports:
      - "${MALL_FRONTEND_PORT:-8088}:80"
    restart: unless-stopped
    networks:
      - nexus-devops

  mall:
    image: nexus/mall-app:${IMAGE_TAG:-local}
    build:
      context: ../mall/mall-app
      dockerfile: Dockerfile
    container_name: nexus-mall
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${MALL_JAVA_OPTS:--Xms256m -Xmx512m -server -XX:+HeapDumpOnOutOfMemoryError -javaagent:/opt/skywalking/skywalking-agent/skywalking-agent.jar -Dskywalking.collector.backend_service=${SKYWALKING_BACKEND_SERVICE:-100.86.250.112:11800} -Dskywalking.agent.service_name=mall-service}"
      PARAMS: "--spring.profiles.active=${MALL_SPRING_PROFILES_ACTIVE:-test} --rocketmq.name-server=${MALL_ROCKETMQ_NAME_SERVER:-rmq-namesrv:9876}"
    ports:
      - "${MALL_PORT:-8077}:8077"
    volumes:
      - "${SKYWALKING_AGENT_CONTEXT:-/home/yue/tools/apache-skywalking-java-agent-9.6.0/skywalking-agent}:/opt/skywalking/skywalking-agent:ro"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexus-devops

  order-service:
    image: nexus/order-service-app:${IMAGE_TAG:-local}
    build:
      context: ../order-service/order-service-app
      dockerfile: Dockerfile
    container_name: nexus-order-service
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${ORDER_SERVICE_JAVA_OPTS:--Xms256m -Xmx512m -server -XX:+HeapDumpOnOutOfMemoryError -javaagent:/opt/skywalking/skywalking-agent/skywalking-agent.jar -Dskywalking.collector.backend_service=${SKYWALKING_BACKEND_SERVICE:-100.86.250.112:11800} -Dskywalking.agent.service_name=order-service}"
      PARAMS: "--spring.profiles.active=${ORDER_SERVICE_SPRING_PROFILES_ACTIVE:-test} --rocketmq.name-server=${ORDER_SERVICE_ROCKETMQ_NAME_SERVER:-rmq-namesrv:9876}"
    ports:
      - "${ORDER_SERVICE_PORT:-8092}:8092"
    volumes:
      - "${SKYWALKING_AGENT_CONTEXT:-/home/yue/tools/apache-skywalking-java-agent-9.6.0/skywalking-agent}:/opt/skywalking/skywalking-agent:ro"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexus-devops

  group-buy-service:
    image: nexus/group-buy-service-app:${IMAGE_TAG:-local}
    build:
      context: ../group-buy-service/group-buy-service-app
      dockerfile: Dockerfile
    container_name: nexus-group-buy-service
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${GROUP_BUY_SERVICE_JAVA_OPTS:--Xms256m -Xmx512m -server -XX:+HeapDumpOnOutOfMemoryError -javaagent:/opt/skywalking/skywalking-agent/skywalking-agent.jar -Dskywalking.collector.backend_service=${SKYWALKING_BACKEND_SERVICE:-100.86.250.112:11800} -Dskywalking.agent.service_name=group-buy-service}"
      PARAMS: "--spring.profiles.active=${GROUP_BUY_SERVICE_SPRING_PROFILES_ACTIVE:-test} --rocketmq.name-server=${GROUP_BUY_SERVICE_ROCKETMQ_NAME_SERVER:-rmq-namesrv:9876}"
    ports:
      - "${GROUP_BUY_SERVICE_PORT:-8093}:8093"
    volumes:
      - "${SKYWALKING_AGENT_CONTEXT:-/home/yue/tools/apache-skywalking-java-agent-9.6.0/skywalking-agent}:/opt/skywalking/skywalking-agent:ro"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexus-devops

  seckill-service:
    image: nexus/seckill-service-app:${IMAGE_TAG:-local}
    build:
      context: ../seckill-service/seckill-service-app
      dockerfile: Dockerfile
    container_name: nexus-seckill-service
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${SECKILL_SERVICE_JAVA_OPTS:--Xms256m -Xmx512m -server -XX:+HeapDumpOnOutOfMemoryError -javaagent:/opt/skywalking/skywalking-agent/skywalking-agent.jar -Dskywalking.collector.backend_service=${SKYWALKING_BACKEND_SERVICE:-100.86.250.112:11800} -Dskywalking.agent.service_name=seckill-service}"
      PARAMS: "--spring.profiles.active=${SECKILL_SERVICE_SPRING_PROFILES_ACTIVE:-test} --rocketmq.name-server=${SECKILL_SERVICE_ROCKETMQ_NAME_SERVER:-rmq-namesrv:9876}"
    ports:
      - "${SECKILL_SERVICE_PORT:-8094}:8094"
    volumes:
      - "${SKYWALKING_AGENT_CONTEXT:-/home/yue/tools/apache-skywalking-java-agent-9.6.0/skywalking-agent}:/opt/skywalking/skywalking-agent:ro"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexus-devops

  pay:
    image: nexus/pay-app:${IMAGE_TAG:-local}
    build:
      context: ../pay/pay-app
      dockerfile: Dockerfile
    container_name: nexus-pay
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${PAY_JAVA_OPTS:--Xms256m -Xmx512m -server -XX:+HeapDumpOnOutOfMemoryError -javaagent:/opt/skywalking/skywalking-agent/skywalking-agent.jar -Dskywalking.collector.backend_service=${SKYWALKING_BACKEND_SERVICE:-100.86.250.112:11800} -Dskywalking.agent.service_name=pay-service}"
      PARAMS: "--spring.profiles.active=${PAY_SPRING_PROFILES_ACTIVE:-test} --rocketmq.name-server=${PAY_ROCKETMQ_NAME_SERVER:-rmq-namesrv:9876}"
    ports:
      - "${PAY_PORT:-18080}:${PAY_INTERNAL_PORT:-18080}"
    volumes:
      - "${SKYWALKING_AGENT_CONTEXT:-/home/yue/tools/apache-skywalking-java-agent-9.6.0/skywalking-agent}:/opt/skywalking/skywalking-agent:ro"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexus-devops

  gateway:
    image: nexus/springcloud-gateway:${IMAGE_TAG:-local}
    build:
      context: ../springcloud-gateway/app
      dockerfile: Dockerfile
    container_name: nexus-gateway
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${GATEWAY_JAVA_OPTS:--Xms256m -Xmx512m -server -XX:+HeapDumpOnOutOfMemoryError -javaagent:/opt/skywalking/skywalking-agent/skywalking-agent.jar -Dskywalking.collector.backend_service=${SKYWALKING_BACKEND_SERVICE:-100.86.250.112:11800} -Dskywalking.agent.service_name=gateway}"
      PARAMS: "--spring.profiles.active=${GATEWAY_SPRING_PROFILES_ACTIVE:-test} --rocketmq.name-server=${GATEWAY_ROCKETMQ_NAME_SERVER:-rmq-namesrv:9876}"
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    volumes:
      - "${SKYWALKING_AGENT_CONTEXT:-/home/yue/tools/apache-skywalking-java-agent-9.6.0/skywalking-agent}:/opt/skywalking/skywalking-agent:ro"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexus-devops

  ops-agent-spring-ai:
    image: nexus/ops-agent-spring-ai:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ops-agent-spring-ai/Dockerfile
      additional_contexts:
        skywalking-agent: "${SKYWALKING_AGENT_CONTEXT:-/home/yue/tools/apache-skywalking-java-agent-9.6.0/skywalking-agent}"
    container_name: nexus-ops-agent-spring-ai
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${OPS_AGENT_JAVA_OPTS:--Xms256m -Xmx512m -server -XX:+HeapDumpOnOutOfMemoryError -javaagent:/opt/skywalking/skywalking-agent/skywalking-agent.jar -Dskywalking.collector.backend_service=${SKYWALKING_BACKEND_SERVICE:-100.86.250.112:11800} -Dskywalking.agent.service_name=ops-agent-spring-ai -Dskywalking.trace.ignore_path=/actuator/**,*:/actuator/**,SpringScheduled/**,HikariCP/**,SpringCloudGateway/GatewayFilter,Mysql/JDBC/PreparedStatement/execute}"
      PARAMS: "--server.port=2322 --spring.profiles.active=${SPRING_PROFILES_ACTIVE:-dev} --rocketmq.name-server=${ROCKETMQ_NAME_SERVER:-rmq-namesrv:9876} --ops-ai.otlp.enabled=${OPS_AI_OTLP_ENABLED:-true} --ops-ai.otlp.endpoint=${OPS_AI_OTLP_ENDPOINT:-http://100.86.250.112:11800} --ops-ai.otlp.service-name=${OPS_AI_OTLP_SERVICE_NAME:-ops-agent-spring-ai}"
    ports:
      - "${OPS_AGENT_PORT:-2322}:2322"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexus-devops

networks:
  nexus-devops:
    external: true
