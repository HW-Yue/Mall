# 命令执行 docker-compose -f docker-compose-environment.yml up -d
# 再启动监控栈：docker-compose -f docker-compose-grafana.yml up -d（依赖下方固定网络名 nexus-devops）
# 从 Nacos 2.x 换 3.x 时，请按官方说明升级 MySQL 库 nacos_config 表结构，见 Nacos 发行包 distribution/conf/mysql-schema.sql
# docker 代理和使用文档；https://bugstack.cn/md/road-map/docker.html
version: '3.9'
services:
  # MySQL 增加健康检测，避免
  mysql:
    image: mysql:8.0.32
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 123456
    networks:
      - my-network
    ports:
      - "13306:3306"
    volumes:
      - ./mysql/sql:/docker-entrypoint-initdb.d
      - ./mysql/conf/my.cnf:/etc/mysql/my.cnf
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      # 在 mysql 容器内探测本实例，勿写宿主机 IP
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  mysql-business-sync:
    image: mysql:8.0.32
    container_name: mysql-business-sync
    restart: "no"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_HOST: mysql
      MYSQL_USER: root
    volumes:
      - ./mysql/sql:/work/sql:ro
    command: [ "sh", "/work/sql/zzz-sync-business-sql-on-start.sh" ]
    networks:
      - my-network
    depends_on:
      mysql:
        condition: service_healthy

  canal-server:
    image: canal/canal-server:v1.1.6
    container_name: canal-server
    ports:
      - "11111:11111"
    environment:
      - canal.instance.master.address=mysql:3306 # 注意：这里用docker内部服务名
      - canal.instance.dbUsername=canal
      - canal.instance.dbPassword=canal
      - canal.instance.connectionCharset=UTF-8
      - canal.instance.tsdb.enable=true
      - canal.instance.gtid.enable=false
      # 这里的 slaveId 必须和 MySQL 的 server-id (1) 不同
      - canal.instance.mysql.slaveId=100
      # 过滤哪些库哪些表。格式：数据库\.表名
      - canal.instance.filter.regex=nexus_product\..*
    networks:
      - my-network # 确保和你的 MySQL 在同一个网络

  # phpmyadmin https://hub.docker.com/_/phpmyadmin

  # Redis
  redis:
    image: redis:6.2
    container_name: redis
    restart: always
    hostname: redis
    privileged: true
    ports:
      - 16379:6379
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - my-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # RedisAdmin https://github.com/joeferner/redis-commander
  redis-admin:
    image: spryker/redis-commander:0.8.0
    container_name: redis-admin
    hostname: redis-commander
    restart: always
    ports:
      - 8081:8081
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin
      - LANG=C.UTF-8
      - LANGUAGE=C.UTF-8
      - LC_ALL=C.UTF-8
    networks:
      - my-network
    depends_on:
      redis:
        condition: service_healthy

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 重点看下面这一行：把当前目录下的 docker 文件夹映射到容器里的 /data
      - ./docker:/data
    ports:
      - "9000:9000"

  nacos:
    image: nacos/nacos-server:v3.2.0
    container_name: nacos
    restart: always
    ports:
      # Nacos 3.x：控制台在 8080；8848 主要为 HTTP API，旧版 /nacos 控制台地址不再适用
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
    environment:
      # 与 nacos-docker 启动脚本一致（JVM_MS/JVM_MX 旧写法在官方脚本中不生效）
      - JVM_XMS=256M
      - JVM_XMX=512M
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_DB_NAME=nacos_config
      # 容器间访问 MySQL 用 3306；13306 仅宿主机映射 ports，不要用错
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      - NACOS_AUTH_ENABLE=false
      # 与 NACOS_AUTH_ENABLE 独立：Nacos 3 默认开启 Admin API 鉴权，脚本 POST /v3/admin/cs/config 会 403
      - NACOS_AUTH_ADMIN_ENABLE=false
      - NACOS_AUTH_IDENTITY_KEY=2222
      - NACOS_AUTH_IDENTITY_VALUE=2xxx
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      # Prometheus HTTP SD（不要用 JAVA_OPT_EXT 写 -D：官方脚本把 JAVA_OPT_EXT 接在 -jar 之后，-D 不会进 JVM）
      # https://nacos.io/docs/latest/ecology/use-nacos-prometheus-sd/
      - NACOS_PROMETHEUS_METRICS_ENABLED=true
    networks:
      - my-network
    depends_on:
      mysql:
        condition: service_healthy

  # DynamicTp / Sentinel 规则发布：不在 compose 内跑一次性 bash 容器；Nacos 就绪后在宿主机执行
  # nacos/init-nacos-runtime.sh：一键发布 YAML（DEFAULT_GROUP）+ Sentinel（SENTINEL_GROUP）；或分别见 dtp-config / sentinel-rules

  # Sentinel Dashboard（仅用于实时观测：QPS/RT/请求链路、簇点监控、机器列表）
  # 规则以 Nacos 为准，Dashboard 上的临时改动不回写 Nacos（生产最佳实践）
  # 访问：http://127.0.0.1:8858   默认账号密码：sentinel / sentinel
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: sentinel-dashboard
    restart: always
    ports:
      - "8858:8858"
      - "8719:8719" # Dashboard 拉取客户端 /metric 指标的 transport 端口
    environment:
      - JAVA_OPTS=-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=127.0.0.1:8858 -Dproject.name=sentinel-dashboard -Dsentinel.dashboard.auth.username=sentinel -Dsentinel.dashboard.auth.password=sentinel
    networks:
      - my-network

networks:
  my-network:
    name: nexus-devops
    driver: bridge
