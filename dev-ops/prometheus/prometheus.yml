# 说明：
# - nacos-sd-spring-boot：Nacos 官方 HTTP SD，URL 见 scrape_configs（需 Nacos 开启 nacos.prometheus.metrics.enabled）
#   Docker 下勿用 JAVA_OPT_EXT=-D...（官方启动脚本把其放在 -jar 之后，-D 不生效）；用环境变量 NACOS_PROMETHEUS_METRICS_ENABLED=true
#   文档：https://nacos.io/docs/latest/ecology/use-nacos-prometheus-sd/
# - 业务需暴露 management.endpoints.web.exposure.include 含 prometheus，且与下方 metrics_path 一致
# - 验证：curl -s http://100.86.250.112:8848/nacos/prometheus 应返回 200 与 JSON 数组；再打开 http://100.86.250.112:9090/targets
# - Target DOWN、connection refused 且 instance=100.86.250.112：应用在宿主机注册成本机回环，容器内 100.86.250.112 不是宿主机；见下方 relabel（依赖 prometheus 的 extra_hosts: host.docker.internal:host-gateway）

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'nacos-sd-spring-boot'
    metrics_path: '/actuator/prometheus'
    honor_labels: true
    http_sd_configs:
      - url: 'http://nacos:8848/nacos/prometheus'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        regex: '127\.0\.0\.1:(.*)'
        replacement: 'host.docker.internal:${1}'
        target_label: __address__
      # Drop Dubbo Triple 端口（20880-20889）：Nacos 实例级注册会把 Dubbo 端口也吐出来，
      # 用 /actuator/prometheus 打过去会触发 Dubbo "Invoker not found" 异常刷屏
      - source_labels: [__address__]
        regex: '.*:2088[0-9]'
        action: drop

  # ===== 中间件 Exporter =====
  # 三个 exporter 通过 docker-compose-exporters.yml 启动；统一打 application=shared，
  # ops-agent-spring-ai 通过 category 标签匹配 SOP 规则后委派到对应 skill 域（mysql / redis / rocketmq / hikari）。

  - job_name: 'mysqld-exporter'
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          application: shared
          category: mysql

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          application: shared
          category: redis

  - job_name: 'rocketmq-exporter'
    static_configs:
      - targets: ['rocketmq-exporter:5557']
        labels:
          application: shared
          category: rocketmq
