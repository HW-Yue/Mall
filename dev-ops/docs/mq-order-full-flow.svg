<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1180" width="1680" height="1180">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial,
        'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif;
    }
    .title { font-size: 28px; font-weight: 800; fill: #1a1a1a; }
    .sub { font-size: 14px; fill: #6a6a6a; }
    .layer { font-size: 15px; font-weight: 700; fill: #6a6a6a; }
    .node-title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    .node-line { font-size: 13px; fill: #424242; }
    .topic { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
    .topic-small { font-size: 12px; fill: #4a4a4a; }
    .label { font-size: 12px; fill: #4a4a4a; }
    .small { font-size: 11px; fill: #5a5a5a; }
    .http { stroke: #4d6f99; stroke-width: 2.4; fill: none; marker-end: url(#arrow-http); }
    .mq { stroke: #5a5a5a; stroke-width: 2.6; fill: none; marker-end: url(#arrow-mq); }
    .state { stroke: #6a6a6a; stroke-width: 2.1; stroke-dasharray: 6 4; fill: none; marker-end: url(#arrow-state); }
    .comp { stroke: #8a5a44; stroke-width: 2.2; stroke-dasharray: 4 4; fill: none; marker-end: url(#arrow-comp); }
  </style>

  <defs>
    <marker id="arrow-mq" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#5a5a5a"/>
    </marker>
    <marker id="arrow-http" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#4d6f99"/>
    </marker>
    <marker id="arrow-state" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#6a6a6a"/>
    </marker>
    <marker id="arrow-comp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#8a5a44"/>
    </marker>
    <filter id="shadow-soft">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00000018"/>
    </filter>
  </defs>

  <rect width="1680" height="1180" fill="#f8f6f3"/>
  <text x="840" y="42" text-anchor="middle" class="title">Nexus 项目 MQ 流转与订单全流程</text>
  <text x="840" y="68" text-anchor="middle" class="sub">覆盖普通商品、秒杀、拼团三类订单：建单、支付、营销结算、履约、关单与退款补偿</text>

  <text x="36" y="138" class="layer">入口 / 业务服务</text>
  <text x="36" y="322" class="layer">RocketMQ Topic</text>
  <text x="36" y="612" class="layer">消费处理 / 状态推进</text>
  <text x="36" y="858" class="layer">存储与外部系统</text>
  <text x="36" y="1048" class="layer">补偿链路</text>

  <!-- Services -->
  <rect x="100" y="100" width="170" height="82" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="185" y="130" text-anchor="middle" class="node-title">用户 / 前端</text>
  <text x="185" y="153" text-anchor="middle" class="node-line">Nginx 网关</text>
  <text x="185" y="173" text-anchor="middle" class="node-line">轮询 orderId / 拉支付页</text>

  <rect x="330" y="100" width="190" height="82" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="425" y="128" text-anchor="middle" class="node-title">mall-service</text>
  <text x="425" y="151" text-anchor="middle" class="node-line">普通商品下单</text>
  <text x="425" y="171" text-anchor="middle" class="node-line">先锁商城库存</text>

  <rect x="570" y="100" width="210" height="82" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="675" y="128" text-anchor="middle" class="node-title">seckill-service</text>
  <text x="675" y="151" text-anchor="middle" class="node-line">Lua 扣可售库存</text>
  <text x="675" y="171" text-anchor="middle" class="node-line">生成 seckillToken</text>

  <rect x="830" y="100" width="210" height="82" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="935" y="128" text-anchor="middle" class="node-title">group-buy-service</text>
  <text x="935" y="151" text-anchor="middle" class="node-line">拼团锁单 / 结算</text>
  <text x="935" y="171" text-anchor="middle" class="node-line">队伍超时定时消息</text>

  <rect x="1090" y="100" width="210" height="82" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="1195" y="128" text-anchor="middle" class="node-title">order-service</text>
  <text x="1195" y="151" text-anchor="middle" class="node-line">统一订单状态机</text>
  <text x="1195" y="171" text-anchor="middle" class="node-line">LOCK / PAY_SUCCESS</text>

  <rect x="1360" y="100" width="210" height="82" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="1465" y="128" text-anchor="middle" class="node-title">pay-service</text>
  <text x="1465" y="151" text-anchor="middle" class="node-line">生成支付单 / 回调</text>
  <text x="1465" y="171" text-anchor="middle" class="node-line">发送 pay-success-*</text>

  <!-- Core topics -->
  <rect x="300" y="260" width="1110" height="260" rx="16" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="855" y="290" text-anchor="middle" class="node-title">RocketMQ 业务 Topic 总线</text>

  <rect x="330" y="318" width="210" height="58" rx="10" fill="#fff7df" stroke="#4a4a4a" stroke-width="1.8"/>
  <text x="435" y="342" text-anchor="middle" class="topic">normal-order-create</text>
  <text x="435" y="362" text-anchor="middle" class="topic-small">普通订单异步落库</text>

  <rect x="570" y="318" width="210" height="58" rx="10" fill="#fff7df" stroke="#4a4a4a" stroke-width="1.8"/>
  <text x="675" y="342" text-anchor="middle" class="topic">seckill-order-create</text>
  <text x="675" y="362" text-anchor="middle" class="topic-small">秒杀异步建单</text>

  <rect x="810" y="318" width="220" height="58" rx="10" fill="#fff7df" stroke="#4a4a4a" stroke-width="1.8"/>
  <text x="920" y="342" text-anchor="middle" class="topic">pay-success-*</text>
  <text x="920" y="362" text-anchor="middle" class="topic-small">normal / group_buy / seckill</text>

  <rect x="1060" y="318" width="220" height="58" rx="10" fill="#fff7df" stroke="#4a4a4a" stroke-width="1.8"/>
  <text x="1170" y="342" text-anchor="middle" class="topic">order-paid-*</text>
  <text x="1170" y="362" text-anchor="middle" class="topic-small">营销侧支付成功</text>

  <rect x="330" y="420" width="210" height="58" rx="10" fill="#fff7df" stroke="#4a4a4a" stroke-width="1.8"/>
  <text x="435" y="444" text-anchor="middle" class="topic">order-close-*</text>
  <text x="435" y="464" text-anchor="middle" class="topic-small">超时 / 未支付关单</text>

  <rect x="570" y="420" width="210" height="58" rx="10" fill="#fff7df" stroke="#4a4a4a" stroke-width="1.8"/>
  <text x="675" y="444" text-anchor="middle" class="topic">pay-refund-*</text>
  <text x="675" y="464" text-anchor="middle" class="topic-small">退款请求</text>

  <rect x="810" y="420" width="220" height="58" rx="10" fill="#fff7df" stroke="#4a4a4a" stroke-width="1.8"/>
  <text x="920" y="444" text-anchor="middle" class="topic">pay-refund-*-result</text>
  <text x="920" y="464" text-anchor="middle" class="topic-small">退款完成回执</text>

  <rect x="1060" y="420" width="220" height="58" rx="10" fill="#fff7df" stroke="#4a4a4a" stroke-width="1.8"/>
  <text x="1170" y="444" text-anchor="middle" class="topic">group-buy-success-notify</text>
  <text x="1170" y="464" text-anchor="middle" class="topic-small">成团后触发履约</text>

  <rect x="1300" y="420" width="90" height="58" rx="10" fill="#fff7df" stroke="#4a4a4a" stroke-width="1.8"/>
  <text x="1345" y="444" text-anchor="middle" class="topic">ship</text>
  <text x="1345" y="464" text-anchor="middle" class="topic-small">发货</text>

  <!-- Consumers and state -->
  <rect x="300" y="580" width="230" height="96" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="415" y="610" text-anchor="middle" class="node-title">建单 Consumer</text>
  <text x="415" y="634" text-anchor="middle" class="node-line">NormalOrderCreateListener</text>
  <text x="415" y="654" text-anchor="middle" class="node-line">SeckillOrderCreateListener</text>

  <rect x="580" y="580" width="230" height="96" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="695" y="610" text-anchor="middle" class="node-title">支付成功 Consumer</text>
  <text x="695" y="634" text-anchor="middle" class="node-line">PaySuccess*Listener</text>
  <text x="695" y="654" text-anchor="middle" class="node-line">订单 LOCK → PAY_SUCCESS</text>

  <rect x="860" y="580" width="250" height="96" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="985" y="610" text-anchor="middle" class="node-title">营销结算 Consumer</text>
  <text x="985" y="634" text-anchor="middle" class="node-line">OrderPaidGroupBuyListener</text>
  <text x="985" y="654" text-anchor="middle" class="node-line">OrderPaidSeckillListener</text>

  <rect x="1160" y="580" width="230" height="96" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="1275" y="610" text-anchor="middle" class="node-title">履约 Consumer</text>
  <text x="1275" y="634" text-anchor="middle" class="node-line">GroupBuySuccessNotify</text>
  <text x="1275" y="654" text-anchor="middle" class="node-line">OrderShipTaskListener</text>

  <rect x="510" y="738" width="650" height="64" rx="12" fill="#ffffff" stroke="#4a4a4a" stroke-width="2.2"/>
  <text x="835" y="764" text-anchor="middle" class="node-title">订单状态主线</text>
  <text x="835" y="787" text-anchor="middle" class="node-line">LOCK 锁单 / 待支付 → PAY_SUCCESS 已支付 → WAIT_SHIP 待发货 → SHIPPED 已发货 → DELIVERED 已签收</text>

  <!-- Storage -->
  <rect x="170" y="840" width="220" height="88" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="280" y="872" text-anchor="middle" class="node-title">Redis</text>
  <text x="280" y="896" text-anchor="middle" class="node-line">seckill:stock / token</text>
  <text x="280" y="916" text-anchor="middle" class="node-line">orderId 轮询结果</text>

  <rect x="455" y="840" width="220" height="88" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="565" y="872" text-anchor="middle" class="node-title">order DB</text>
  <text x="565" y="896" text-anchor="middle" class="node-line">t_order / 状态机</text>
  <text x="565" y="916" text-anchor="middle" class="node-line">outTradeNo 幂等</text>

  <rect x="740" y="840" width="220" height="88" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="850" y="872" text-anchor="middle" class="node-title">pay DB</text>
  <text x="850" y="896" text-anchor="middle" class="node-line">pay_order</text>
  <text x="850" y="916" text-anchor="middle" class="node-line">PAY_WAIT / PAY_SUCCESS</text>

  <rect x="1025" y="840" width="220" height="88" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="1135" y="872" text-anchor="middle" class="node-title">营销库存库</text>
  <text x="1135" y="896" text-anchor="middle" class="node-line">group_buy_order</text>
  <text x="1135" y="916" text-anchor="middle" class="node-line">sc_sku_activity</text>

  <rect x="1310" y="840" width="220" height="88" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="1420" y="872" text-anchor="middle" class="node-title">支付宝 / Mock</text>
  <text x="1420" y="896" text-anchor="middle" class="node-line">支付页 / 回调</text>
  <text x="1420" y="916" text-anchor="middle" class="node-line">退款接口</text>

  <!-- Compensation -->
  <rect x="210" y="1010" width="260" height="82" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="340" y="1040" text-anchor="middle" class="node-title">超时关单 Job</text>
  <text x="340" y="1063" text-anchor="middle" class="node-line">order-service triggerTimeoutClose</text>
  <text x="340" y="1083" text-anchor="middle" class="node-line">group-buy 定时退款消息</text>

  <rect x="540" y="1010" width="260" height="82" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="670" y="1040" text-anchor="middle" class="node-title">关单 Consumer</text>
  <text x="670" y="1063" text-anchor="middle" class="node-line">order / pay / seckill / groupbuy</text>
  <text x="670" y="1083" text-anchor="middle" class="node-line">释放锁定库存或关闭支付单</text>

  <rect x="870" y="1010" width="260" height="82" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="1000" y="1040" text-anchor="middle" class="node-title">退款 Consumer</text>
  <text x="1000" y="1063" text-anchor="middle" class="node-line">pay-service 调支付宝退款</text>
  <text x="1000" y="1083" text-anchor="middle" class="node-line">营销侧回滚本地状态/库存</text>

  <rect x="1200" y="1010" width="260" height="82" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="1330" y="1040" text-anchor="middle" class="node-title">退款回执</text>
  <text x="1330" y="1063" text-anchor="middle" class="node-line">pay-refund-*-result</text>
  <text x="1330" y="1083" text-anchor="middle" class="node-line">订单 WAIT_REFUND → REFUNDED</text>

  <!-- Main arrows: entry to topics -->
  <path d="M520 142 C545 142 545 347 330 347" class="mq"/>
  <text x="445" y="238" class="label">submitNormalOrderFromMall()</text>

  <path d="M675 182 L675 318" class="mq"/>
  <text x="690" y="245" class="label">convertAndSend</text>

  <path d="M1465 182 C1465 250 1070 260 920 318" class="mq"/>
  <text x="1246" y="250" class="label">支付回调后发送</text>

  <path d="M1195 182 C1195 238 1170 268 1170 318" class="mq"/>
  <text x="1214" y="254" class="label">订单已支付后发布</text>

  <!-- Topic to consumers -->
  <path d="M435 376 L415 580" class="mq"/>
  <path d="M675 376 C675 450 445 500 415 580" class="mq"/>
  <path d="M920 376 C860 470 720 500 695 580" class="mq"/>
  <path d="M1170 376 C1120 455 1000 500 985 580" class="mq"/>
  <path d="M1170 478 C1200 520 1250 535 1275 580" class="mq"/>
  <path d="M1345 478 C1345 532 1305 548 1275 580" class="mq"/>

  <!-- Processing to state/storage -->
  <path d="M415 676 C420 720 500 760 565 840" class="state"/>
  <text x="434" y="728" class="label">INSERT LOCK</text>
  <path d="M695 676 C690 735 620 790 565 840" class="state"/>
  <text x="650" y="753" class="label">PAY_SUCCESS</text>
  <path d="M985 676 C1020 745 1080 790 1135 840" class="state"/>
  <text x="1036" y="752" class="label">结算 / 扣真实库存</text>
  <path d="M1275 676 C1240 760 660 735 835 738" class="state"/>
  <text x="1118" y="725" class="label">WAIT_SHIP / SHIPPED</text>

  <!-- HTTP / external arrows -->
  <path d="M270 132 L330 132" class="http"/>
  <text x="286" y="122" class="label">普通下单</text>
  <path d="M270 150 L570 150" class="http"/>
  <text x="382" y="170" class="label">秒杀下单</text>
  <path d="M270 168 C510 232 920 210 1090 168" class="http"/>
  <text x="745" y="220" class="label">query_seckill_order / get_pay_url</text>
  <path d="M1300 142 L1360 142" class="http"/>
  <text x="1310" y="132" class="label">getPayUrl</text>
  <path d="M1465 182 C1465 430 1435 680 1420 840" class="http"/>
  <text x="1484" y="512" class="label">支付 / 回调 / 退款</text>
  <path d="M675 182 C620 520 370 700 280 840" class="state"/>
  <text x="474" y="528" class="label">Redis 可售库存 / token</text>
  <path d="M415 676 C340 735 300 790 280 840" class="state"/>
  <text x="312" y="756" class="label">写 orderId 供轮询</text>

  <!-- Compensation arrows -->
  <path d="M340 1010 C340 885 390 640 435 478" class="comp"/>
  <text x="260" y="742" class="label">publishOrderClose</text>
  <path d="M435 478 C500 770 620 920 670 1010" class="comp"/>
  <path d="M670 1010 C650 932 615 884 565 928" class="comp"/>
  <path d="M670 1010 C710 938 785 910 850 928" class="comp"/>
  <path d="M670 1010 C520 938 340 930 280 928" class="comp"/>
  <path d="M670 420 C705 808 930 930 1000 1010" class="comp"/>
  <text x="720" y="732" class="label">已支付后关单 / 用户退款</text>
  <path d="M1000 1010 C1000 934 1240 920 1420 928" class="comp"/>
  <text x="1134" y="955" class="label">调用退款</text>
  <path d="M1000 1010 C965 878 935 612 920 478" class="comp"/>
  <text x="942" y="780" class="label">退款完成后发回执</text>
  <path d="M920 478 C1020 780 1240 940 1330 1010" class="comp"/>
  <path d="M1330 1010 C1140 955 760 950 565 928" class="comp"/>
  <text x="1082" y="975" class="label">REFUNDED</text>
  <path d="M985 676 C910 790 900 820 850 840" class="state"/>
  <text x="888" y="806" class="label">支付单状态</text>

  <!-- Topic annotations -->
  <text x="1240" y="508" class="small">order-ship-task</text>
  <text x="1098" y="508" class="small">成团通知</text>
  <text x="560" y="508" class="small">pay-refund-normal / group-buy / seckill</text>
  <text x="300" y="508" class="small">order-close-normal / group-buy / seckill</text>

  <!-- Legend -->
  <rect x="1295" y="645" width="300" height="124" rx="10" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="1318" y="673" class="node-title">图例</text>
  <line x1="1318" y1="696" x2="1370" y2="696" class="http"/>
  <text x="1382" y="701" class="label">HTTP / RPC 调用</text>
  <line x1="1318" y1="724" x2="1370" y2="724" class="mq"/>
  <text x="1382" y="729" class="label">RocketMQ 投递 / 消费</text>
  <line x1="1318" y1="752" x2="1370" y2="752" class="state"/>
  <text x="1382" y="757" class="label">DB / Redis 状态写入</text>

  <rect x="96" y="1098" width="1488" height="44" rx="10" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="118" y="1125" class="small">关键消费组示例：CG_NORMAL_ORDER_CREATE、CG_SECKILL_ORDER_CREATE_ORDER、CG_PAY_SUCCESS_*、CG_ORDER_PAID_SECKILL、CG_GROUP_BUY_ORDER_PAID、CG_ORDER_SHIP_TASK、CG_PAY_REFUND_*_RESULT</text>
</svg>
