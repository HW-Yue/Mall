<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#5a5a5a"/>
    </marker>
    <filter id="shadow-soft">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000012"/>
    </filter>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue',
          Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif;
      }
      .title { fill: #1a1a1a; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #6a6a6a; font-size: 13px; }
      .section { fill: #6a6a6a; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
      .header { fill: #1a1a1a; font-size: 14px; font-weight: 700; }
      .box-label { fill: #1a1a1a; font-size: 13px; font-weight: 600; }
      .topic-label { fill: #1a1a1a; font-size: 12px; font-weight: 600; }
      .note { fill: #6a6a6a; font-size: 12px; }
      .arrow-label { fill: #5a5a5a; font-size: 11px; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#f8f6f3"/>

  <text x="600" y="38" text-anchor="middle" class="title">RocketMQ Topic 路由图</text>
  <text x="600" y="62" text-anchor="middle" class="subtitle">按 topic 一行一条，标出“谁生产了哪个 topic，谁消费了哪个 topic”</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">服务名使用模块简称：pay / order / group-buy / seckill</text>

  <text x="170" y="112" text-anchor="middle" class="header">生产者</text>
  <text x="560" y="112" text-anchor="middle" class="header">Topic</text>
  <text x="960" y="112" text-anchor="middle" class="header">消费者</text>

  <line x1="50" y1="122" x2="1150" y2="122" stroke="#d7d2ca" stroke-width="1.5"/>

  <text x="56" y="150" class="section">支付成功链路</text>
