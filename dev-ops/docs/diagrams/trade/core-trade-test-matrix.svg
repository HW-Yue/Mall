  <rect width="1680" height="1320" fill="#f8f6f3"/>
  <text x="840" y="44" text-anchor="middle" class="title">核心交易测试矩阵图</text>
  <text x="840" y="68" text-anchor="middle" class="subtitle">矩阵按交易链路组织，展示每条核心路径在入口、Feign、MQ、成功、补偿、幂等等维度上的目标覆盖要求</text>

  <rect x="44" y="92" width="1592" height="92" rx="16" fill="#f3f3f1" stroke="#d8d4ce" stroke-width="1.5"/>
  <text x="70" y="122" class="header">图例</text>
  <text x="70" y="152" class="legend">● 已纳入核心覆盖目标</text>
  <text x="286" y="152" class="legend">◐ 聚合测试或部分独立断言</text>
  <text x="564" y="152" class="legend">○ 不适用或不属于该链路主责任</text>
  <text x="896" y="152" class="note">这张图用于定义核心交易收口标准，不展开非交易管理端、网关、DCC、首页聚合等范围</text>

