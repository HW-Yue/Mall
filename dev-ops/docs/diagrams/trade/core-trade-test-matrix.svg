<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1320" width="1680" height="1320">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue',
          Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif;
      }
      .title { fill: #1a1a1a; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #6a6a6a; font-size: 14px; }
      .header { fill: #1a1a1a; font-size: 14px; font-weight: 700; }
      .row-label { fill: #1a1a1a; font-size: 13px; font-weight: 600; }
      .cell-text { fill: #1a1a1a; font-size: 18px; font-weight: 700; }
