input {
  tcp {
    mode => "server"
    host => "0.0.0.0"
    port => 4560
    codec => json_lines
    type => "info"
  }
}
filter {}
output {
  elasticsearch {
      action => "index"
      hosts => "es:9200"
      index => "nexus-%{[service]}-%{+YYYY.MM.dd}"
      # Logstash 9.x 里 ES output 默认行为兼容旧索引写入；显式关掉 data_stream，
      # 确保索引仍然按 "nexus-<service>-YYYY.MM.dd" 的常规索引形态写入。
      data_stream => "false"
  }
  stdout { codec => rubydebug }
}
