<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒杀库存预热管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #1e293b;
        }
        .page-header {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page-header h1 { font-size: 18px; font-weight: 700; color: #0f172a; }
        .page-header .subtitle { font-size: 13px; color: #64748b; margin-top: 2px; }
        .nav-links { display: flex; gap: 12px; }
        .nav-links a {
            font-size: 13px; color: #2563eb; text-decoration: none;
            padding: 4px 10px; border-radius: 6px; border: 1px solid #bfdbfe;
            transition: background 0.15s;
        }
        .nav-links a:hover { background: #eff6ff; }
        .main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-header {
            padding: 14px 20px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-header h2 { font-size: 15px; font-weight: 600; }
        .card-body { padding: 20px; }
        .global-preheat {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
        }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; color: #64748b; font-weight: 500; }
        .form-group select,
        .form-group input {
            padding: 7px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            color: #1e293b;
            outline: none;
            min-width: 180px;
        }
        .form-group select:focus,
        .form-group input:focus { border-color: #2563eb; }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
        }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-outline { background: #fff; color: #2563eb; border: 1px solid #bfdbfe; }
        .btn-outline:hover:not(:disabled) { background: #eff6ff; }
        .btn-refresh { background: #fff; color: #475569; border: 1px solid #cbd5e1; }
        .btn-refresh:hover:not(:disabled) { background: #f8fafc; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        thead th {
            background: #f8fafc;
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }
        tbody td {
            padding: 10px 14px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: #f8fafc; }
        .activity-row td { background: #f8fafc; font-weight: 600; color: #374151; }
        .activity-row td:first-child { padding-left: 14px; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-preheated { background: #dcfce7; color: #15803d; }
        .badge-not-preheated { background: #fee2e2; color: #b91c1c; }
        .stock-input {
            width: 80px;
            padding: 4px 7px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 12px;
            text-align: center;
        }
        .expire-input {
            width: 90px;
            padding: 4px 7px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 12px;
            text-align: center;
        }
        .result-box {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            display: none;
        }
        .result-box.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
        .result-box.error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
        .result-box.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }
        .loading-row td { text-align: center; padding: 32px; color: #94a3b8; }
        .empty-row td { text-align: center; padding: 32px; color: #94a3b8; }
        .indent { padding-left: 28px !important; }
        .text-muted { color: #94a3b8; font-style: italic; }
    </style>
</head>
<body>

<div class="page-header">
    <div>
        <h1>秒杀库存预热管理</h1>
        <div class="subtitle">手动将秒杀商品库存预热到 Redis，支持设置过期时间</div>
    </div>
    <div class="nav-links">
        <a href="index.html">返回商城</a>
        <a href="order-list.html">订单列表</a>
    </div>
</div>

<div class="main">

    <!-- 批量预热区 -->
    <div class="card">
        <div class="card-header">
            <h2>批量预热</h2>
        </div>
        <div class="card-body">
            <div class="global-preheat">
                <div class="form-group">
                    <label>选择活动</label>
                    <select id="batchActivitySelect">
                        <option value="">加载中...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>过期时间（分钟）</label>
                    <input type="number" id="batchExpireMinutes" value="120" min="1" max="14400" style="min-width:120px">
                </div>
                <button class="btn btn-primary" id="batchPreheatBtn" onclick="batchPreheat()">预热该活动所有商品</button>
            </div>
            <div class="result-box" id="batchResult"></div>
        </div>
    </div>

    <!-- 活动商品列表 -->
    <div class="card">
        <div class="card-header">
            <h2>活动商品预热状态</h2>
            <button class="btn btn-refresh" onclick="loadActivities()">刷新</button>
        </div>
        <div class="card-body" style="padding:0">
            <table>
                <thead>
                    <tr>
                        <th>活动 / 商品</th>
                        <th>数据库库存</th>
                        <th>Redis 当前值</th>
                        <th>预热状态</th>
                        <th>预热库存</th>
                        <th>过期时间（分钟）</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="activitiesTableBody">
                    <tr class="loading-row"><td colspan="7">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="js/common.js"></script>
<script src="js/api-config.js"></script>
<script src="js/seckill-admin.js"></script>
</body>
</html>
