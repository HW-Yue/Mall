<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 商品商城</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .mall-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 12px 12px 80px;
        }
        .mall-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e7eb;
        }
        .mall-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mall-logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
        }
        .mall-logo-text {
            font-weight: 800;
            color: #0f172a;
            letter-spacing: 0.04em;
            font-size: 14px;
        }
        .mall-categories {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin: 12px 0 8px;
            padding-bottom: 4px;
        }
        .mall-category-tab {
            flex-shrink: 0;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid #e5e7eb;
            background: #fff;
            font-size: 12px;
            color: #4b5563;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mall-category-tab.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.22);
        }
        .mall-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .mall-section-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
        }
        .mall-section-subtitle {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        .mall-section-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mall-section-icon {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }
        .mall-products-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        @media (min-width: 768px) {
            .mall-products-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        .mall-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.18s ease-out;
        }
        .mall-card:hover {
            border-color: #bfdbfe;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            transform: translateY(-2px);
        }
        .mall-card-image {
            position: relative;
            padding-top: 65%;
            overflow: hidden;
        }
        .mall-card-image img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease-out;
        }
        .mall-card:hover .mall-card-image img {
            transform: scale(1.05);
        }
        .mall-card-body {
            padding: 8px 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .mall-card-title {
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.3;
            max-height: 2.6em;
            overflow: hidden;
        }
        .mall-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: #9ca3af;
        }
        .mall-card-price {
            margin-top: 4px;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .mall-card-price-main {
            font-size: 15px;
            font-weight: 800;
            color: #dc2626;
        }
        .mall-card-price-sub {
            font-size: 11px;
            color: #9ca3af;
        }
        .mall-card-footer {
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #f3f4f6;
            padding-top: 6px;
        }
        .mall-card-buy-btn {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
        }
        .mall-empty {
            padding: 32px 16px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }
        .mall-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }
        .mall-page-btn {
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid #e5e7eb;
            background: #fff;
            font-size: 12px;
            cursor: pointer;
            color: #374151;
        }
        .mall-page-btn[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .mall-page-info {
            font-size: 12px;
            color: #6b7280;
        }
        /* 活动横滑模块 */
        .mall-activity-section {
            margin-top: 12px;
            margin-bottom: 4px;
        }
        .mall-activity-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 6px 2px 2px;
            scrollbar-width: thin;
        }
        .mall-activity-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .mall-activity-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.7);
            border-radius: 999px;
        }
        .mall-activity-card {
            flex: 0 0 190px;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.18s ease-out;
        }
        .mall-activity-card:hover {
            border-color: #bfdbfe;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            transform: translateY(-2px);
        }
        .mall-activity-card-image {
            position: relative;
            padding-top: 60%;
            overflow: hidden;
        }
        .mall-activity-card-image img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .mall-activity-card-body {
            padding: 8px 9px 9px;
        }
        .mall-activity-card-title {
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.3;
            max-height: 2.6em;
            overflow: hidden;
        }
        .mall-activity-card-meta {
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #9ca3af;
        }
        .mall-activity-card-price {
            margin-top: 4px;
            font-size: 13px;
            font-weight: 700;
            color: #dc2626;
        }
        .mall-activity-tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
        }
        .mall-activity-tag.group {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
        .mall-activity-tag.seckill {
            background: linear-gradient(135deg, #f97316, #ea580c);
        }
        /* 详情弹窗 */
        .mall-modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(6px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding: 0 0 12px;
            z-index: 50;
        }
        @media (min-width: 768px) {
            .mall-modal-mask {
                align-items: center;
                padding: 16px;
            }
        }
        .mall-modal {
            width: 100%;
            max-width: 780px;
            max-height: 92vh;
            background: #fff;
            border-radius: 24px 24px 16px 16px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
            display: flex;
            flex-direction: column;
            position: relative;
            transform: translateY(40px);
            opacity: 0;
            transition: all 0.20s ease-out;
        }
        .mall-modal-mask.show .mall-modal {
            transform: translateY(0);
            opacity: 1;
        }
        .mall-modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: none;
            background: #f3f4f6;
            color: #6b7280;
            font-size: 14px;
            cursor: pointer;
        }
        .mall-modal-body {
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) {
            .mall-modal-body {
                flex-direction: row;
            }
        }
        .mall-modal-image {
            padding: 12px;
        }
        .mall-modal-image img {
            width: 100%;
            max-width: 320px;
            border-radius: 18px;
            object-fit: cover;
        }
        .mall-modal-content {
            padding: 16px 18px 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
        }
        .mall-modal-title {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
        }
        .mall-modal-desc {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }
        .mall-modal-specs {
            margin-top: 4px;
            padding: 10px 10px 8px;
            border-radius: 14px;
            background: #f9fafb;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            font-size: 11px;
        }
        .mall-modal-spec-key {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9ca3af;
        }
        .mall-modal-spec-value {
            font-weight: 600;
            color: #374151;
        }
        .mall-modal-footer {
            margin-top: 6px;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .mall-modal-price-wrap {
            font-size: 11px;
            color: #9ca3af;
        }
        .mall-modal-price-main {
            font-size: 20px;
            font-weight: 900;
            color: #dc2626;
        }
        .mall-modal-buy-btn {
            padding: 10px 22px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.4);
        }
        /* 支付确认弹窗 */
        .payment-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 60;
        }
        .payment-modal {
            width: 90%;
            max-width: 360px;
            background: #fff;
            border-radius: 18px;
            padding: 18px 16px 14px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.4);
            font-size: 13px;
            color: #111827;
        }
        .payment-modal h3 {
            margin: 0 0 8px;
            font-size: 15px;
            font-weight: 700;
        }
        .payment-modal p {
            margin: 4px 0;
        }
        .payment-modal .copyable {
            color: #2563eb;
            cursor: pointer;
            text-decoration: underline;
        }
        .payment-modal .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }
        .payment-modal .confirm-btn,
        .payment-modal .cancel-btn {
            padding: 4px 10px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }
        .payment-modal .confirm-btn {
            background: #16a34a;
            color: #fff;
        }
        .payment-modal .cancel-btn {
            background: #e5e7eb;
            color: #374151;
        }
    </style>
</head>
<body>
<div class="mall-nav">
    <div class="mall-logo">
        <div class="mall-logo-icon">AI</div>
        <div class="mall-logo-text">RESOURCE MALL</div>
    </div>
    <button class="action-btn order-list-btn" onclick="window.location.href='order-list.html'">我的订单</button>
</div>

<div class="mall-container">
    <!-- 活动区：超值拼团 -->
    <div id="groupBuySection" class="mall-activity-section" style="display: none;">
        <div class="mall-section-header">
            <div class="mall-section-left">
                <div class="mall-section-icon">团</div>
                <div>
                    <div class="mall-section-title">超值拼团</div>
                    <div class="mall-section-subtitle">GROUP BUY DEALS</div>
                </div>
            </div>
        </div>
        <div id="groupBuyList" class="mall-activity-scroll"></div>
    </div>

    <!-- 活动区：整点秒杀 -->
    <div id="seckillSection" class="mall-activity-section" style="display: none;">
        <div class="mall-section-header">
            <div class="mall-section-left">
                <div class="mall-section-icon">秒</div>
                <div>
                    <div class="mall-section-title">整点秒杀</div>
                    <div class="mall-section-subtitle">FLASH SALE</div>
                </div>
            </div>
        </div>
        <div id="seckillList" class="mall-activity-scroll"></div>
    </div>

    <!-- 分类 Tabs -->
    <div class="mall-categories" id="categoryTabs">
        <!-- 动态渲染 -->
    </div>

    <!-- 标题 -->
    <div class="mall-section-header">
        <div class="mall-section-left">
            <div class="mall-section-icon">★</div>
            <div>
                <div class="mall-section-title">全部商品</div>
                <div class="mall-section-subtitle">GENERAL GOODS</div>
            </div>
        </div>
        <div class="mall-section-right">

    <!-- 分页 -->
    <div class="mall-pagination">

<!-- 商品详情弹窗 -->
<div id="goodsModalMask" class="mall-modal-mask">
    <div class="mall-modal">
        <button class="mall-modal-close" id="goodsModalClose">✕</button>
        <div class="mall-modal-body">
            <div class="mall-modal-image">
                <img id="modalImage" src="" alt="">
            </div>
            <div class="mall-modal-content">
                <div>
                    <div class="mall-modal-title" id="modalTitle"></div>

                <div class="mall-modal-footer">

                        <div>当前售价</div>

                    </div>
                    <button class="mall-modal-buy-btn" id="modalBuyBtn">立即购买</button>

        </div>

</div>

<!-- 拼团详情弹窗 -->
<div id="groupBuyModalMask" class="mall-modal-mask">
    <div class="mall-modal">
        <button class="mall-modal-close" id="groupBuyModalClose">✕</button>
        <div class="mall-modal-body">
            <div class="mall-modal-content">
                <div>
                    <div class="mall-modal-title" id="groupBuyGoodsTitle"></div>
                    <div class="mall-modal-desc" id="groupBuyGoodsSummary"></div>
                    <div class="mall-modal-specs">

                </div>
                <div style="margin-top: 8px;">
                    <div style="font-size: 12px;color: #6b7280;margin-bottom: 4px;">进行中团（最多展示 2 个）</div>
                    <div id="groupBuyTeamList"></div>
                </div>
                <div class="mall-modal-footer">
                    <div class="mall-modal-price-wrap">
                        <div>拼团价</div>
                        <div class="mall-modal-price-main" id="groupBuyPayPrice"></div>
                    </div>
                    <button class="mall-modal-buy-btn" id="groupBuyOpenBtn">自己开团</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="seckillModalMask" class="mall-modal-mask">
    <div class="mall-modal">
        <button class="mall-modal-close" id="seckillModalClose">✕</button>
        <div class="mall-modal-body">
            <div class="mall-modal-content">
                <div>
                    <div class="mall-modal-title" id="seckillGoodsTitle"></div>
                    <div class="mall-modal-desc" id="seckillGoodsSummary"></div>
                    <div class="mall-modal-specs">
                        <div>
                            <div class="mall-modal-spec-key">限时秒杀</div>
                            <div class="mall-modal-spec-value" id="seckillActivityInfo"></div>
                        </div>
                    </div>
                </div>
                <div class="mall-modal-footer">
                    <div class="mall-modal-price-wrap">
                        <div>秒杀价</div>
                        <div class="mall-modal-price-main" id="seckillPayPrice"></div>
                    </div>
                    <button class="mall-modal-buy-btn" id="seckillBuyBtn">立即秒杀</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script src="js/api-config.js"></script>
<script>
// 支付确认弹窗
function showPaymentConfirm(price) {
    const overlay = document.createElement('div');
    overlay.className = 'payment-overlay';

    const modal = document.createElement('div');
    modal.className = 'payment-modal';
    modal.innerHTML = `
        <h3>支付确认</h3>
        <p>商品金额：￥${price}</p>
        <p>买家账号：<span class="copyable" data-copy="kvhmoj3832@sandbox.com">cakpap0977@sandbox.com</span></p>
        <p>登录密码：111111</p>
        <p>支付密码：111111</p>
        <div class="modal-buttons">
            <button class="confirm-btn">确认支付</button>
            <button class="cancel-btn">取消支付</button>
        </div>
    `;

    modal.querySelector('.confirm-btn').addEventListener('click', function() {
        const form = document.querySelector('form');
        if (form) form.submit();
        overlay.remove();
    });

    modal.querySelector('.cancel-btn').addEventListener('click', function() {
        document.querySelectorAll('form').forEach(form => form.remove());
        overlay.remove();
    });

    modal.querySelector('.copyable').addEventListener('click', function() {
        const textToCopy = this.getAttribute('data-copy');
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert('买家账号已复制到剪贴板');
        }).catch(err => {
            console.error('无法复制文本: ', err);
        });
    });

    overlay.appendChild(modal);
    document.body.appendChild(overlay);
}
</script>
<script src="js/mall.js"></script>
</body>
