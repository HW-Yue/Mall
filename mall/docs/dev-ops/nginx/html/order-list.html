<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - AI Resource Mall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            background-color: #f8fafc;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1e293b;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        .order-card {
            transition: all 0.2s ease;
        }
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgb(0 0 0 / 0.05);
        }

        /* 隐藏滚动条 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-12">

<!-- 顶部导航 -->
<nav class="glass-nav sticky top-0 z-50 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='index.html'" class="w-10 h-10 flex items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <h1 class="text-lg font-bold text-slate-900 tracking-tight">我的订单</h1>
        </div>
        
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200">
            <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
            <span id="userIdDisplay" class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Loading ID...</span>
        </div>
    </div>
</nav>

<main class="max-w-4xl mx-auto px-4 pt-8">
    
    <!-- 统计概览 -->
    <div class="grid grid-cols-3 gap-4 mb-8">
        <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center">
            <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mb-2">
                <i data-lucide="package" class="w-5 h-5"></i>
            </div>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Orders</p>
            <p id="totalOrderCount" class="text-xl font-black text-slate-900">--</p>
        </div>
        <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center">
            <div class="w-10 h-10 rounded-full bg-green-50 text-green-600 flex items-center justify-center mb-2">
                <i data-lucide="check-circle" class="w-5 h-5"></i>
            </div>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Completed</p>
            <p id="completedOrderCount" class="text-xl font-black text-slate-900">--</p>
        </div>
        <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center">
            <div class="w-10 h-10 rounded-full bg-orange-50 text-orange-600 flex items-center justify-center mb-2">
                <i data-lucide="clock" class="w-5 h-5"></i>
            </div>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pending</p>
            <p id="pendingOrderCount" class="text-xl font-black text-slate-900">--</p>
        </div>
    </div>

    <!-- 订单列表容器 -->
    <div id="orderList" class="space-y-4">
        <!-- 动态渲染 -->
    </div>

    <!-- 加载更多 -->
    <div class="mt-8 flex justify-center">
        <button id="loadMoreBtn" class="px-8 py-3 rounded-2xl bg-white border border-slate-200 text-slate-600 font-bold hover:bg-slate-50 transition-colors shadow-sm hidden">
            加载更多订单
        </button>
    </div>

    <!-- 空状态 -->
    <div id="emptyState" class="hidden py-24 text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-100 mb-6 text-slate-400">
            <i data-lucide="clipboard-list" class="w-10 h-10"></i>
        </div>
        <h3 class="text-xl font-bold text-slate-900 mb-2">暂无订单数据</h3>
        <p class="text-slate-500 max-w-xs mx-auto text-sm">你还没有任何订单，快去首页选购喜欢的资源吧！</p>
        <button onclick="window.location.href='index.html'" class="mt-8 px-6 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 transition-all">
            前往商城
        </button>
    </div>

    <!-- 加载中 -->
    <div id="loadingTip" class="hidden py-8 text-center">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600/20 border-t-blue-600"></div>
    </div>
</main>

<!-- 退单确认弹窗 -->
<div id="refundModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-all duration-300">
    <div class="w-full max-w-sm bg-white rounded-[32px] overflow-hidden shadow-2xl p-8 transform transition-all">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-circle" class="w-8 h-8"></i>
            </div>
            <h3 class="text-2xl font-extrabold text-slate-900">确认退单</h3>
            <p class="text-slate-500 text-sm mt-2">确定要退款并关闭该订单吗？此操作不可撤销。</p>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <button id="cancelRefund" class="py-4 rounded-2xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200 transition-colors">保留订单</button>
            <button id="confirmRefund" class="py-4 rounded-2xl bg-red-600 text-white font-bold hover:bg-red-700 transition-all shadow-lg shadow-red-200">确认退单</button>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script src="js/api-config.js"></script>
<script>
    // 初始化 Lucide 图标
    lucide.createIcons();
</script>
<script src="js/order-list.js"></script>
</body>
</html>
