# RocketMQ Broker 本地开发配置（与 docker-compose-rocketmq.yml 配套）
# Linux 纯 Docker 内互通时，可将 brokerIP1 改为 broker 容器在网桥上的 IP，或使用宿主机可达 IP。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

brokerIP1 = my-rocketmq-broker
listenPort = 10911

# 与 compose 中网段内 NameServer 服务名一致
namesrvAddr = rmq-namesrv:9876

# 开发环境便于联调；生产务必关闭，改为控制台或运维脚本建 Topic
autoCreateTopicEnable = true

