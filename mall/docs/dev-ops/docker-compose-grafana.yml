# Grafana MCP server https://github.com/grafana/mcp-grafana
version: '3.9'
# 先启动 docker-compose-environment.yml 创建网络 nexus-devops，再执行本文件：
#   docker-compose -f docker-compose-grafana.yml up -d
# 这样 prometheus 可通过 http://nacos:8848 使用 Nacos 官方 Prometheus HTTP SD
services:
  # 数据采集
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-network

  # 告警管理：接收 Prometheus 告警，路由到 AI Agent Webhook
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-network

  # 监控界面；
  # 数据库配置说明，本地docker，链接非docker内的本地mysql，可以配置 host.docker.internal 或者本地IP地址。
  grafana:
    image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/grafana:10.2.0
    container_name: grafana
    restart: always
    ports:
      - 4000:4000
    depends_on:
      - prometheus
    volumes:
      - ./grafana:/etc/grafana
    environment:
      - GF_DATABASE_TYPE=mysql
      - GF_DATABASE_HOST=mysql:3306
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=root
      - GF_DATABASE_PASSWORD=123456
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=qwertyuiop  # 这里填你想设的密码
    networks:
      - my-network

  # 监控服务 mcp https://github.com/grafana/mcp-grafana
  grafana-mcp:
    image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/grafana-mcp:latest
    container_name: grafana-mcp
    ports:
      - "8000:8000"
    environment:
      - GRAFANA_URL=http://grafana:4000
      - GRAFANA_API_KEY=glsa_eab5ZxOL6jBZ6URxjoCYepRcf7boRiqy_6e61bb1a
    restart: unless-stopped
    networks:
      - my-network


  # Prometheus MCP Server — 让 AI 助手通过 MCP 协议查询 PromQL 指标
  # 文档：https://github.com/pab1it0/prometheus-mcp-server
  # 使用方式：
  #   1. 启动：docker-compose -f docker-compose-grafana.yml up -d prometheus-mcp
  #   2. 测试：curl http://localhost:8001/sse
  #   3. 接入 Claude Desktop / Cursor 等客户端，添加 SSE 服务端点：http://localhost:8001/sse
  # 可用工具：execute_query（执行 PromQL）、list_metrics（列指标）、execute_range_query（范围查询）
  prometheus-mcp:
    image: ghcr.io/pab1it0/prometheus-mcp-server:latest
    container_name: prometheus-mcp
    ports:
      - "8001:8080"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - PROMETHEUS_MCP_SERVER_TRANSPORT=sse
      - PROMETHEUS_MCP_BIND_HOST=0.0.0.0
      - PROMETHEUS_MCP_BIND_PORT=8080
      - PROMETHEUS_REQUEST_TIMEOUT=30
    restart: unless-stopped
    networks:
      - my-network
    depends_on:
      - prometheus

networks:
  my-network:
    name: nexus-devops
    external: true
