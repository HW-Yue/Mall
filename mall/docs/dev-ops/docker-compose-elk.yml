version: '3.9'
# 执行脚本；docker-compose -f docker-compose-elk.yml up -d
# 需已存在网络 nexus-devops：先 docker compose -f docker-compose-environment.yml up -d
#   或 docker network create nexus-devops
# 控制台；GET _cat/indices - 查看 nexus-<service>-yyyy.MM.dd 是否存在，上报后存在，则表示接入成功
#
# 9.x 升级说明：
#   - 三组件统一升到 9.2.x（ES/Kibana/Logstash 必须同版本）
#   - xpack.security.enabled=false 显式关闭默认 TLS + basic auth，与无鉴权的 dev 链路对齐
#     （Logstash / Kibana / ES MCP 都无需带凭证；生产需另行开启）
#   - 7→9 索引格式不兼容，换命名卷 esdata，升级前需 docker compose down -v 清旧数据
#   - Kibana 9 推荐 ELASTICSEARCH_HOSTS（大写）环境变量
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    ports:
      - '9200:9200'
      - '9300:9300'
    container_name: elasticsearch
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: always
    environment:
      - 'cluster.name=docker-cluster'
      - 'discovery.type=single-node'
      - 'xpack.security.enabled=false'
      - 'xpack.security.enrollment.enabled=false'
      - 'xpack.security.http.ssl.enabled=false'
      - 'xpack.security.transport.ssl.enabled=false'
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    networks:
      my-network:
        aliases:
          - es # 兼容原 links 中的 es 主机名

  logstash:
    image: docker.elastic.co/logstash/logstash:9.2.0
    container_name: logstash
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - '4560:4560'
      - '50000:50000/tcp'
      - '50000:50000/udp'
      - '9600:9600'
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
      MONITORING_ENABLED: "false"
      XPACK_MONITORING_ENABLED: "false"
    networks:
      - my-network
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.0
    container_name: kibana
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
    ports:
      - '5601:5601'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN
    networks:
      - my-network
    depends_on:
      - elasticsearch

volumes:
  esdata:
    name: nexus-esdata

networks:
  my-network:
    name: nexus-devops
    external: true
