server:
  port: 8091
  tomcat:
    mbeanregistry:
      enabled: true
    max-connections: 20
    accept-count: 10

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

app:
  config:
    api-version: v1
    cross-origin: '*'
    ali-pay:
      api-url: http://pay:8095
      notify-url: http://mall:8091/api/v1/
      source: s01
      chanel: c01
    no-market:
      api-url: http://mall:8091
      notify-url: http://mall:8091/
      source: s01
      chanel: c01
  order:
    internal-create-token: ""

spring:
  main:
    allow-bean-definition-overriding: true
  config:
    import:
      - classpath:nacos/mall-service-dtp-dev.yml
      - optional:nacos:mall-service-dtp-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:mall-service-datasource-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
  application:
    name: mall-service
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        locator:
          enabled: true
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        import-check:
          enabled: false
    sentinel:
      eager: true
      transport:
        dashboard: sentinel-dashboard:8858
        port: 8724
      datasource:
        flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-flow-rules.json
            groupId: SENTINEL_GROUP
            rule-type: flow
            data-type: json
        degrade:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-degrade-rules.json
            groupId: SENTINEL_GROUP
            rule-type: degrade
            data-type: json
        param-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-param-flow-rules.json
            groupId: SENTINEL_GROUP
            rule-type: param-flow
            data-type: json
        system:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-system-rules.json
            groupId: SENTINEL_GROUP
            rule-type: system
            data-type: json
        authority:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-authority-rules.json
            groupId: SENTINEL_GROUP
            rule-type: authority
            data-type: json
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://mysql:3306/test_mall_db?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES'
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Mall_HikariCP
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 15
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 3000ms
      client-name: mall-redisson
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://redis:6379"
          database: 0
          clientName: mall-redisson
          connectionPoolSize: 10
          connectionMinimumIdleSize: 5
          idleConnectionTimeout: 30000
          pingConnectionInterval: 60000
          retryAttempts: 3
          retryInterval: 1000
          connectTimeout: 5000
          timeout: 3000
          keepAlive: true

rocketmq:
  name-server: rmq-namesrv:9876
  producer:
    group: mall-producer
    send-message-timeout: 3000
  consumer:
    group: mall-consumer

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 扳手工程；动态配置中心在 test compose 下走容器内 Redis
xfg:
  wrench:
    config:
      system: group-buy-market
      register:
        host: redis
        port: 6379

logstash:
  enabled: true
  host: logstash
  port: 4560

logging:
  level:
    root: info
  config: classpath:logback-spring.xml

yue:
  log:
    trace:
      provider: skywalking

dubbo:
  application:
    # Dubbo 用独立 service-name，避免与 Spring Cloud 同名导致 gateway 把 HTTP 请求路由到 Triple 端口
    name: ${spring.application.name}-dubbo
  registry:
    address: nacos://nacos:8848
    register-mode: instance
  protocol:
    name: tri
    port: 20882
  consumer:
    timeout: 5000
    retries: 2
    check: false
  provider:
    timeout: 5000
