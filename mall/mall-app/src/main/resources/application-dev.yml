# 应用配置
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'
    # SC 渠道配置 - 拼团对接渠道值、回调通知
    ali-pay:
      api-url: http://127.0.0.1:8080
      notify-url: http://127.0.0.1:8091/api/v1/
      source: s01
      chanel: c01
    no-market:
      api-url: http://127.0.0.1:8091
      notify-url: http://127.0.0.1:8001/
      source: s01
      chanel: c01
  # RocketMQ 业务配置（mall 不再消费 pay-success-* 和 group-buy-success-notify，已迁移到各微服务）


server:
  port: 8077
  # 1核2G内存，可默认配置 200；4核8G内存【accept-count=1000、max-threads=800、max-connections=10000】，线程数经验值800。线程池过大，cpu调度会消耗大量时间
  tomcat:
    mbeanregistry:
      enabled: true
    max-connections: 20 # 最大连接数
    threads:
      max: 20         # 设定处理客户请求的线程的最大数目，决定了服务器可以同时响应客户请求的数,默认200
      min-spare: 10   # 初始化线程数,最小空闲线程数,默认是10
    accept-count: 10  # 等待队列长度

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 2
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: mall
  cloud:
    nacos:
      discovery:
        ip: 127.0.0.1
        server-addr: 127.0.0.1:8848
        # 注意：locator 必须和 server-addr 对齐！！
        locator:
          enabled: true
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://localhost:13306/mall_db?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true&sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES'
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource
# Apache RocketMQ（docker-compose-rocketmq.yml 启动后可用；前缀必须为 rocketmq，勿放在 spring 下）
rocketmq:
  name-server: localhost:9876
  producer:
    group: mall-producer
    send-message-timeout: 3000
  consumer:
    group: mall-consumer

# MyBatis 配置【如需使用记得打开】
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location:  classpath:/mybatis/config/mybatis-config.xml
# Redis
redis:
  sdk:
    config:
      host: localhost
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

# 扳手工程；通用配置组件「配置中心、设计模式框架、限流服务」
xfg:
  wrench:
    config:
      system: group-buy-market
      register:
        #redis host ,动态配置中心要用
        host: localhost
        port: 16379

# 日志；logstash部署的服务器IP
logstash:
  enabled: true
  host: 127.0.0.1
  port: 4560

# 监控配置 Prometheus + Grafana
management:
  endpoints:
    web:
      exposure:
        include: "*" # 暴露所有端点，包括自定义端点
  endpoint:
    health:
      show-details: always # 显示详细的健康检查信息
  metrics:
    export:
      prometheus:
        enabled: true # 启用Prometheus
  prometheus:
    enabled: true # 启用Prometheus端点

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml