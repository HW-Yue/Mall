# 应用配置
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'
    # SC 渠道配置 - 拼团对接渠道值、回调通知
    ali-pay:
      api-url: http://100.86.250.112:8080
      notify-url: http://100.86.250.112:8091/api/v1/
      source: s01
      chanel: c01
    no-market:
      api-url: http://100.86.250.112:8091
      notify-url: http://100.86.250.112:8001/
      source: s01
      chanel: c01
  # 调用 order-service create_order_normal_from_mall 时与订单侧 app.order.internal-create-token 对齐（空表示不校验）
  order:
    internal-create-token: ""
  # RocketMQ 业务配置：mall 这里只保留 topic 常量对齐，不直接承担 MQ 生产职责


server:
  port: 8077
  # Tomcat 工作线程由 DynamicTp spring.dynamic.tp.tomcat-tp 管理；此处保留连接层参数
  tomcat:
    mbeanregistry:
      enabled: true
    max-connections: 20
    accept-count: 10

# 数据库配置；启动时配置数据库资源信息
spring:
  main:
    allow-bean-definition-overriding: true
  config:
    import:
      - classpath:nacos/mall-service-dtp-dev.yml
      - optional:nacos:mall-service-dtp-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:mall-service-datasource-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
  application:
    name: mall-service
  cloud:
    nacos:
      discovery:
        ip: 100.86.250.112
        server-addr: 100.86.250.112:8848
        # 注意：locator 必须和 server-addr 对齐！！
        locator:
          enabled: true
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        import-check:
          enabled: false
    # Sentinel：流控/熔断/降级。规则以 Nacos 为源，动态生效。
    # Dashboard 仅用于实时观测；规则改动请在 Nacos 中编辑对应 DataId 的 JSON。
    sentinel:
      eager: true  # 启动即建立 Dashboard 心跳，不必等首次请求
      transport:
        dashboard: 100.86.250.112:8858
        port: 8724           # 同机与 Dashboard(宿主机 8719)及其它服务 transport 错开
      datasource:
        # 流控规则（FlowRule）
        flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-flow-rules.json
            groupId: SENTINEL_GROUP
            rule-type: flow
            data-type: json
        # 熔断降级规则（DegradeRule）
        degrade:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-degrade-rules.json
            groupId: SENTINEL_GROUP
            rule-type: degrade
            data-type: json
        # 热点参数规则（ParamFlowRule）
        param-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-param-flow-rules.json
            groupId: SENTINEL_GROUP
            rule-type: param-flow
            data-type: json
        # 系统规则（SystemRule）
        system:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-system-rules.json
            groupId: SENTINEL_GROUP
            rule-type: system
            data-type: json
        # 授权规则（AuthorityRule）
        authority:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-authority-rules.json
            groupId: SENTINEL_GROUP
            rule-type: authority
            data-type: json
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://100.86.250.112:13306/mall_db?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true&sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES'
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Mall_HikariCP
      minimum-idle: 15
      idle-timeout: 180000
      maximum-pool-size: 25
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  # Redis：统一用官方 redisson-spring-boot-starter
  # - spring.data.redis.*        ：标准 Spring Data Redis 配置（RedisTemplate 分支 + starter 共用）
  # - spring.redis.redisson.config：Redisson 专属 YAML inline，clientName 便于 redis_exporter 反查
  data:
    redis:
      host: 100.86.250.112
      port: 16379
      database: 0
      timeout: 3000ms
      client-name: mall-redisson
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://100.86.250.112:16379"
          database: 0
          clientName: mall-redisson
          connectionPoolSize: 10
          connectionMinimumIdleSize: 5
          idleConnectionTimeout: 30000
          pingConnectionInterval: 60000
          retryAttempts: 3
          retryInterval: 1000
          connectTimeout: 5000
          timeout: 3000
          keepAlive: true
# Apache RocketMQ（docker-compose-rocketmq.yml 启动后可用；前缀必须为 rocketmq，勿放在 spring 下）
rocketmq:
  name-server: 100.86.250.112:9876
  producer:
    group: mall-producer
    send-message-timeout: 3000
  consumer:
    group: mall-consumer

# MyBatis 配置【如需使用记得打开】
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location:  classpath:/mybatis/config/mybatis-config.xml

# 扳手工程；通用配置组件「配置中心、设计模式框架、限流服务」
xfg:
  wrench:
    config:
      system: group-buy-market
      register:
        #redis host ,动态配置中心要用
        host: 100.86.250.112
        port: 16379

# 日志；logstash部署的服务器IP
logstash:
  enabled: true
  host: 100.86.250.112
  port: 4560

# 监控配置 Prometheus + Grafana（/actuator/prometheus 供 Prometheus 抓取）
# Actuator：供 Prometheus 抓取 /actuator/prometheus（与 Docker 内 Prometheus + Nacos SD 对接）
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# SkyWalking 本地/IDEA 联调：OAP 10.4.0 + Agent 9.6.0（向后兼容）；JVM 见 .run/ 与 dev-tools/skywalking/README.md
yue:
  log:
    trace:
      provider: skywalking

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
