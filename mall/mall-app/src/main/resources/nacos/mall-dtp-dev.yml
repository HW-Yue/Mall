# DynamicTp 1.1.x：配置前缀 spring.dynamic.tp
# 本地：由 application-dev.yml 通过 spring.config.import classpath 加载。
# Nacos：发布为 DataId「mall-dtp-dev.yml」、Group「DEFAULT_GROUP」，
#       与 optional nacos import 同名即可覆盖 classpath，实现热更新。

spring:
  dynamic:
    tp:
      enabled: true
      enabled-collect: true
      collector-types:
        - micrometer
        - internal_logging
      monitor-interval: 30
      executors:
        - thread-pool-name: threadPoolExecutor
          thread-pool-alias-name: mall-business
          executor-type: common
          core-pool-size: 2
          maximum-pool-size: 50
          queue-capacity: 5000
          queue-type: LinkedBlockingQueue
          rejected-handler-type: CallerRunsPolicy
          keep-alive-time: 5
          thread-name-prefix: mall
          wait-for-tasks-to-complete-on-shutdown: true
          await-termination-seconds: 3
          task-wrapper-names:
            - mdc
          notify-enabled: false
      tomcat-tp:
        thread-pool-alias-name: mall-tomcat
        core-pool-size: 10
        maximum-pool-size: 20
        keep-alive-time: 60
        task-wrapper-names:
          - mdc
        notify-enabled: false
