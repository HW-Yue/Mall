server:
  port: 8099

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    mysql:
      username: root
      password: 123456
      url: jdbc:mysql://localhost:13306/ai-agent-station-study?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: Retail_HikariCP
        minimum-idle: 15 #最小空闲连接数量
        idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
        maximum-pool-size: 25 #连接池最大连接数，默认是10
        auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
        max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
        connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
        connection-test-query: SELECT 1
    pgvector:
      driver-class-name: org.postgresql.Driver
      username: postgres
      password: postgres
      url: jdbc:postgresql://localhost:15432/ai-rag-knowledge
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
        idle-timeout: 30000
        connection-timeout: 30000
  ai:
    openai:
      base-url: https://apis.itedus.cn
      api-key: sk-j6n4nPXRP4KeSP4U3d67272c198042278dAfF262E9Ea1cFa
    agent:
      auto-config:
        enabled: false
  rabbitmq:
    addresses: localhost
    port: 15672
    username: admin
    password: admin
    listener:
      direct:
        prefetch: 1
    template:
      delivery-mode: persistent
      acknowledge-mode: manual # 既然涉及资产消费，建议开启手动确认机制(ACK)
    config:
      consumer:
        exchange: group_buy_market_exchange
        topic_team_success:
          routingkey: topic.team_success
          queue: group_buy_market_queue_2_topic_team_success

# Apache RocketMQ（docker-compose-rocketmq.yml 启动后可用）
rocketmq:
  name-server: localhost:9876
  producer:
    group: agent-producer
    send-message-timeout: 3000
  consumer:
    group: agent-consumer

# RocketMQ 业务 Topic / 消费者组
app:
  rocketmq:
    topic:
      # mall 通知 agent：拼团结算完成，下发 token
      groupBuySuccessNotify: group-buy-success-notify
    consumerGroup:
      groupBuySuccessNotify: CG_AGENT_GROUP_BUY_SUCCESS

# 小傅哥扳手通用组件配置
xfg:
  wrench:
    # 任务调度配置
    task:
      job:
        enabled: true
        pool-size: 5
        thread-name-prefix: "test-task-scheduler-"
        wait-for-tasks-to-complete-on-shutdown: true
        await-termination-seconds: 30
        refresh-interval: 30000
        clean-invalid-tasks-cron: "0 0/5 * * * ?"

# 日志
logging:
  level:
    root: info
    # 开发环境：开启后可在控制台看到发往 LLM 的完整请求体（URL/Headers/Body 格式化 JSON）
    cn.bugstack.ai.config: DEBUG
  config: classpath:logback-spring.xml

# 可选：关闭 AI 请求体日志（默认在 dev/test 下为 true，生产不注册）
# spring.ai.request-logging.enabled: true