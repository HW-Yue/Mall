<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="工具执行模块图">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #0f766e; stroke-width: 2; rx: 18; }
      .title { fill: #115e59; font: 700 24px sans-serif; }
      .text { fill: #134e4a; font: 500 17px sans-serif; }
      .line { stroke: #14b8a6; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#14b8a6"/>
    </marker>
  </defs>
  <rect class="bg" width="1400" height="620"/>

  <rect class="box" x="60" y="220" width="180" height="100"/>
  <text class="title" x="105" y="264">用户</text>
  <text class="text" x="86" y="294">对话 / API 调用</text>

  <rect class="box" x="300" y="220" width="200" height="100"/>
  <text class="title" x="335" y="264">MasterRegistry</text>
  <text class="text" x="336" y="294">菜单 + 执行入口</text>

  <rect class="box" x="550" y="120" width="220" height="100"/>
  <text class="title" x="589" y="164">规则链</text>
  <text class="text" x="576" y="194">审批 / 结果记录 / 白名单</text>

  <rect class="box" x="550" y="300" width="220" height="100"/>
  <text class="title" x="560" y="344">Skill Registry</text>
  <text class="text" x="573" y="374">具体工具域</text>

  <rect class="box" x="840" y="220" width="220" height="100"/>
  <text class="title" x="873" y="264">ToolExecutor</text>
  <text class="text" x="865" y="294">执行工具逻辑</text>

  <rect class="box" x="1120" y="120" width="200" height="100"/>
  <text class="title" x="1154" y="164">审批队列</text>
  <text class="text" x="1138" y="194">写操作等待确认</text>

  <rect class="box" x="1120" y="300" width="200" height="100"/>
  <text class="title" x="1164" y="344">结果返回</text>
  <text class="text" x="1142" y="374">JSON / SSE</text>

  <path class="line" d="M240 270 L300 270"/>
  <path class="line" d="M500 270 L550 170"/>
  <path class="line" d="M500 270 L550 350"/>
  <path class="line" d="M770 170 L840 270"/>
  <path class="line" d="M770 350 L840 270"/>
  <path class="line" d="M1060 270 L1120 170"/>
  <path class="line" d="M1060 270 L1120 350"/>
  <path class="line" d="M1220 220 L1220 300"/>
</svg>
