# category: redis
match-alertname: RedisBlockedClients
match-category: redis
sop-markdown: |
  RedisBlockedClients 阻塞客户端:

  1 redis_inspect:
  redis_client_list：flags=B 等；cmd 是否 BLPOP、BRPOP、BLOCKING 类。
  redis_slowlog：复杂命令阻塞单线程。
  redis_info：blocked_clients、持久化是否 fork 停顿。

  2 日志 elasticsearch_ops:
  长时间阻塞式 Redis 调用、未设超时。

  3 FINAL:
  设计误用（长阻塞）vs 大 key 删除或持久化；改代码还是运维窗口。

steps:
  - type: delegate_subagent
    sub-agent-id: redis_inspect
    task: |
      告警 RedisBlockedClients。
      查询 client list、slowlog、info，重点看 blocked_clients、flags=B、BLPOP/BRPOP/BLOCKING 类命令和持久化 fork 停顿。
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 RedisBlockedClients。
      检索 ${primaryService} 的阻塞式 Redis 调用、超时、未设置超时、连接池等待日志。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 RedisBlockedClients。
      对齐 Redis blocked clients、QPS、RT、业务错误率，判断阻塞是否影响线上请求。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 RedisBlockedClients。
      查看 Redis 容器资源、日志、重启和磁盘/持久化相关异常。
    on-error: continue
