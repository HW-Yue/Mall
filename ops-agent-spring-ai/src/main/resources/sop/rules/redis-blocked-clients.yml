# category: redis
match-alertname: RedisBlockedClients
match-category: redis
sop-markdown: |
  RedisBlockedClients 阻塞客户端:

  1 redis_inspect:
  redis_client_list：flags=B 等；cmd 是否 BLPOP、BRPOP、BLOCKING 类。
  redis_slowlog：复杂命令阻塞单线程。
  redis_info：blocked_clients、持久化是否 fork 停顿。

  2 日志 elasticsearch_ops:
  长时间阻塞式 Redis 调用、未设超时。

  3 FINAL:
  设计误用（长阻塞）vs 大 key 删除或持久化；改代码还是运维窗口。

steps:
  - skill: redis_inspect
    tool: redis_client_list
    args: {}
