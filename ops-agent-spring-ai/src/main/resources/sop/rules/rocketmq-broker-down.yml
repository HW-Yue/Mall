# category: rocketmq
match-alertname: RocketMqBrokerDown
match-category: rocketmq
sop-markdown: |
  RocketMqBrokerDown Broker 不可用:

  1 指标 metrics_ops:
  business_metrics：Broker up、磁盘、句柄；单机还是多节点。

  2 rocketmq_inspect:
  mq_topic_stats：哪些 Topic 仍有路由；区分 NameServer 视图异常还是真宕机。

  3 docker_ops:
  Broker 容器或主机：docker_inspect、docker_logs、docker_stats；磁盘满、OOM、进程退出。

  4 日志 elasticsearch_ops:
  生产者 send failed、超时；消费者 NOT_ONLINE。

  5 FINAL:
  RTO、是否已切主、消息是否可追平；集群手册与值班升级由人工执行，Agent 只做信息收集。

steps:
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 RocketMqBrokerDown。
      先判断 Broker/NameServer 侧 up、延迟和资源指标，区分单节点异常还是全局不可用。
  - type: delegate_subagent
    sub-agent-id: rocketmq_inspect
    task: |
      告警 RocketMqBrokerDown。
      查询 topic 路由与消费状态，判断是 NameServer 视图异常、Broker 下线还是部分 Topic 受影响。
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 RocketMqBrokerDown。
      检索 send failed、NOT_ONLINE、超时重试日志，给出受影响最大的业务服务。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 RocketMqBrokerDown。
      查看 RocketMQ 容器日志、stats、重启与磁盘情况，确认基础设施故障证据。
    on-error: continue
