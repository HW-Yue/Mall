# category: mysql
match-alertname: MySqlTooManyConnections
match-category: mysql
sop-markdown: |
  MySqlTooManyConnections 连接数过多:

  1 mysql_inspect:
  mysql_processlist：按 user、host 找异常客户端。
  mysql_status：Threads_connected、Max_used_connections、max_connections。

  2 规模 nacos_config:
  nacos_list_instances：实例数乘每实例 pool max 是否超过 DB max_connections。
  nacos_get_config：数据源 pool 只读。

  3 日志 elasticsearch_ops:
  连接泄漏、重试风暴、短时大量建连。

  4 指标 metrics_ops:
  jvm_metrics、business_metrics：扩缩容、发布与连接突增对齐。

  5 FINAL:
  缩池、限实例、修泄漏、临时调高 max_connections（需 DBA 审批）及风险说明。

steps:
  - type: delegate_subagent
    sub-agent-id: mysql_inspect
    task: |
      告警 MySqlTooManyConnections。
      查询 processlist 和 status，按 user、host、db、command 聚合连接来源，确认 Threads_connected、Max_used_connections、max_connections。
  - type: delegate_subagent
    sub-agent-id: nacos_config
    task: |
      告警 MySqlTooManyConnections。
      查询 ${primaryService} 实例数和数据源连接池配置，估算实例数乘 pool max 是否超过 DB max_connections。
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 MySqlTooManyConnections。
      检索连接泄漏、重试风暴、短时大量建连、Communications link failure 相关日志。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 MySqlTooManyConnections。
      对齐扩缩容、发布、QPS、JVM 线程和连接数曲线，判断突增来源。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 MySqlTooManyConnections。
      查看 MySQL 容器和 ${primaryService} 容器资源/重启情况，辅助判断是否基础设施异常导致连接堆积。
    on-error: continue
