# category: dubbo
match-alertname: DubboMetadataFailure
match-category: dubbo
sop-markdown: |
  DubboMetadataFailure 元数据操作失败:

  1 指标 metrics_ops:
  查询 dubbo_metadata_push_num_failed_total、dubbo_metadata_subscribe_num_failed_total、dubbo_metadata_store_provider_failed_total。

  2 注册/配置 nacos_config:
  查询 ${application} 实例和相关 Nacos 配置，确认 metadata/report/registry 地址是否异常。

  3 日志 elasticsearch_ops:
  搜 metadata、MetadataReport、ServiceNotFound、NacosException、serialization。

  4 影响判断:
  元数据失败可能不立即中断存量调用，但会影响新实例发现、接口元信息和路由；结合 consumer/provider 错误率确认影响。

  5 FINAL:
  写清是否影响新发布/新调用、失败集中服务、建议恢复动作。

steps:
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 DubboMetadataFailure。
      查询 dubbo metadata failed 指标、up 和相关服务错误率，判断失败是否集中在 ${primaryService} 或全局扩散。
  - type: delegate_subagent
    sub-agent-id: nacos_config
    task: |
      告警 DubboMetadataFailure。
      查询 ${primaryService} 实例、注册中心连接配置、metadata/report/registry 相关配置，确认地址、namespace、group 是否异常。
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 DubboMetadataFailure。
      检索 ${primaryService} 的 metadata、MetadataReport、ServiceNotFound、NacosException、serialization 相关日志。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 DubboMetadataFailure。
      查看 ${primaryService} 和 Nacos 容器的存在性、重启、网络或资源异常证据。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 DubboMetadataFailure。
      复核 consumer/provider 错误率和 RT 是否同步升高，判断元数据失败是否已影响新调用或新实例发现。
    on-error: continue
