# category: dubbo
match-alertname: DubboProviderRtP99High
match-category: dubbo
sop-markdown: |
  DubboProviderRtP99High Provider P99 RT 高:

  1 指标 metrics_ops:
  查询 dubbo_provider_rt_milliseconds_p99、dubbo_provider_qps_total、失败率，判断慢是否伴随流量突增或错误升高。

  2 日志 elasticsearch_ops:
  按 interface/method 搜慢调用、timeout、SQL/Redis/MQ 慢点。

  3 资源与线程:
  联查 DubboThreadPoolActiveHigh、DynamicTP、JVM GC、CPU；慢调用可能来自线程池排队。

  4 下游:
  日志或指标指向数据库、Redis、MQ 时再进入对应 inspect 工具。

  5 FINAL:
  写清慢在 provider 内部还是下游，是否集中单接口/单实例，给出扩容、限流或优化建议。

steps:
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 DubboProviderRtP99High。
      查询 ${primaryService} 的 provider P99 RT、QPS、失败率、interface、method，判断慢调用是否集中且是否伴随流量突增。
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 DubboProviderRtP99High。
      按 interface/method 检索 ${primaryService} 的慢调用、timeout、SQL/Redis/MQ 慢点和 trace 线索。
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 DubboProviderRtP99High。
      联查 Dubbo 线程池、DynamicTP、JVM GC、CPU 和容器资源指标，判断是否线程池排队或 GC 放大 RT。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: mysql_inspect
    task: |
      告警 DubboProviderRtP99High。
      仅当日志或指标指向 DB 慢点时，查询 slow query、processlist、locks。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: redis_inspect
    task: |
      告警 DubboProviderRtP99High。
      仅当日志或指标指向 Redis 慢点时，查询 slowlog、blocked clients、memory。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 DubboProviderRtP99High。
      查看 ${primaryService} 容器 stats、日志和重启情况，确认单实例 CPU throttle、内存压力或网络抖动。
    on-error: continue
