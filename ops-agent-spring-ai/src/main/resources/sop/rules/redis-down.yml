# category: redis
match-alertname: RedisDown
match-category: redis
sop-markdown: |
  RedisDown Redis 不可用:

  1 指标 metrics_ops:
  business_metrics：redis exporter 的 up；单点还是集群多节点探测失败。

  2 redis_inspect:
  redis_info：若部分可连，看 role、master_link_status。
  redis_client_list：是否打满 maxclients。

  3 docker_ops:
  Redis 容器：docker_inspect、docker_logs、docker_stats；OOM、重启、磁盘。

  4 nacos_config:
  中间件地址变更；只读。

  5 日志 elasticsearch_ops:
  连接拒绝、超时风暴时间。

  6 FINAL:
  主从切换、网络、进程、误杀；恢复步骤与是否已降级。

steps:
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 RedisDown。
      查询 redis exporter up、业务错误率和单节点/多节点探测状态，区分 Redis 真不可用还是采集异常。
  - type: delegate_subagent
    sub-agent-id: redis_inspect
    task: |
      告警 RedisDown。
      若仍可连通，查询 redis_info、client list，判断 role、master_link_status、maxclients 或部分节点异常。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 RedisDown。
      查看 Redis 容器 inspect、logs、stats，确认进程退出、OOM、重启、磁盘或网络异常。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 RedisDown。
      检索 ${primaryService} 的 Redis 连接拒绝、超时风暴、主从切换相关日志。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: nacos_config
    task: |
      告警 RedisDown。
      只读查看 ${primaryService} Redis 地址、超时、连接池配置是否近期变更。
    on-error: continue
