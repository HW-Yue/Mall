# category: hikari
match-alertname: HikariConnectionAcquireSlow
match-category: hikari
sop-markdown: |
  HikariConnectionAcquireSlow 获取连接耗时高:

  1 指标 metrics_ops:
  Hikari acquire 与 active、pending 联动；对齐慢 SQL 出现时间。

  2 数据库 mysql_inspect:
  mysql_processlist、mysql_slow_query、mysql_locks。

  3 网络:
  跨 AZ、DNS、防火墙可导致 TCP 慢；结合 instance 在 FINAL 提示人工核对基础设施。

  4 配置 nacos_config:
  connection-timeout、validationTimeout 是否过短误杀；只读。

  5 FINAL:
  根因树：DB 慢、网络、池配置、泄漏；下一步归属应用、DBA 或网络。

steps:
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 HikariConnectionAcquireSlow。
      主服务 ${primaryService}，pool=${pool}。查看 acquire、active、pending、max、timeout 与 QPS/RT 时间线，判断获取连接慢是否伴随池压力。
  - type: delegate_subagent
    sub-agent-id: mysql_inspect
    task: |
      告警 HikariConnectionAcquireSlow。
      查询 processlist、slow query、locks 和 status，判断 DB 慢、锁等待或连接建立慢是否导致 getConnection 变慢。
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 HikariConnectionAcquireSlow。
      检索 ${primaryService} 的 connection acquire、Hikari timeout、Communications link failure、validation 相关日志。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: nacos_config
    task: |
      告警 HikariConnectionAcquireSlow。
      只读查看 ${primaryService} 数据源配置，确认 connection-timeout、validationTimeout、maximum-pool-size 是否近期变更。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 HikariConnectionAcquireSlow。
      查看 ${primaryService} 容器资源与网络相关日志，若证据不足，在结论中提示人工核对跨 AZ、DNS、防火墙。
    on-error: continue
