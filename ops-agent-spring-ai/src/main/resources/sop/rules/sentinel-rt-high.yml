# category: sentinel
match-alertname: SentinelRtHigh
match-category: sentinel
sop-markdown: |
  SentinelRtHigh RT 升高:

  说明：labels.category=sentinel。resource 为 URI 字符串，无 Method 前缀。

  1 指标 metrics_ops:
  sentinel_metrics：对告警中的 resource、app 看 RT、QPS、异常数，与历史对比是陡增还是缓升。
  business_metrics：下游 RT（DB、Redis、HTTP 出站）是否同步变差。

  2 日志 elasticsearch_ops:
  es_search：按 resource 路径、traceId 查慢调用、超时、连接池等待。

  3 依赖:
  mysql_inspect：mysql_processlist、mysql_slow_query。
  redis_inspect：redis_slowlog、redis_client_list。
  rocketmq_inspect：若含 MQ 查消费延迟。

  4 配置 nacos_config:
  nacos_get_config：Sentinel 规则 dataId 只读，阈值熔断是否过紧；变更需审批。
  nacos_list_instances：实例数是否下降导致单机流量放大。

  5 容器 docker_ops:
  CPU throttle、网络问题可致 RT 高：docker_stats、docker_logs。

  6 FINAL:
  区分容量、下游慢、代码回归、限流误伤；给出优先验证的一条证据链。

steps:
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 SentinelRtHigh。
      目标服务优先看 ${primaryService}，resource=${resource}。
      先查 Sentinel RT、block/pass、异常比例，再补业务下游 RT，判断是容量、下游慢还是回归。
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 SentinelRtHigh。
      围绕服务 ${primaryService}、resource=${resource} 检索慢调用、超时、连接池等待、traceId 线索，输出最相关异常样本。
  - type: delegate_subagent
    sub-agent-id: nacos_config
    task: |
      告警 SentinelRtHigh。
      查询 ${primaryService} 的实例数、健康状态，以及 Sentinel/运行时相关配置，确认是否有缩容或动态规则变更。
  - type: delegate_subagent
    sub-agent-id: mysql_inspect
    task: |
      告警 SentinelRtHigh。
      若服务 ${primaryService} 依赖 MySQL，查 processlist、slow query、锁等待，判断 DB 是否拖慢接口 ${resource}。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: redis_inspect
    task: |
      告警 SentinelRtHigh。
      若服务 ${primaryService} 依赖 Redis，查 slowlog、client list、memory，判断缓存或连接问题是否导致 RT 升高。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: rocketmq_inspect
    task: |
      告警 SentinelRtHigh。
      若 labels 中存在 topic/group，结合 ${topic} / ${consumerGroup} 查 MQ 状态；否则仅在结论里说明未发现 MQ 直接线索。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 SentinelRtHigh。
      针对服务 ${primaryService} 所在容器查看 stats、关键日志，确认 CPU throttle、内存压力或网络抖动。
    on-error: continue
