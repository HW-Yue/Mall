# category: mysql
match-alertname: MySqlSlowQueriesHigh
match-category: mysql
sop-markdown: |
  MySqlSlowQueriesHigh 慢查询增多:

  1 mysql_inspect:
  mysql_slow_query：若开了 slow_log 表看最近样本。
  mysql_processlist：长时间运行 SQL、Sending data、Copying to tmp table。
  mysql_status：Slow_queries 等，pattern 可用 Slow%。

  2 指标 metrics_ops:
  business_metrics：mysqld_exporter 指标与慢查询时间线、发布时间对齐。

  3 日志 elasticsearch_ops:
  ORM SQL、DataSource 报错；对齐应用实例。

  4 配置 nacos_config:
  nacos_get_config：shared-mysql-tuning 或 JDBC 参数只读；max_execution_time、索引类发布。

  5 FINAL:
  Top 慢 SQL 模式、是否缺索引、是否需 DBA；避免单条样本下结论。

steps:
  - type: delegate_subagent
    sub-agent-id: mysql_inspect
    task: |
      告警 MySqlSlowQueriesHigh。
      如果 labels 或文本里有表名/库名，优先围绕 table=${table}、db=${database} 排查。
      查询 slow query、processlist、global status、metadata locks，总结最可疑 SQL 模式。
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 MySqlSlowQueriesHigh。
      查看 mysqld_exporter 指标与业务 RT 时间线，对齐是否伴随连接数、锁等待、CPU 或 IO 抖动。
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 MySqlSlowQueriesHigh。
      围绕主服务 ${primaryService} 检索 ORM SQL、连接池超时、SQL 慢日志样本。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: nacos_config
    task: |
      告警 MySqlSlowQueriesHigh。
      查询 ${primaryService} 数据源/JDBC 相关配置，只读确认池大小、超时、慢 SQL 调优项是否近期变更。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 MySqlSlowQueriesHigh。
      查看 MySQL 容器或宿主日志，确认是否存在磁盘、内存、重启等基础设施异常。
    on-error: continue
