# category: rocketmq
match-alertname: RocketMqConsumerLagHigh
match-category: rocketmq
sop-markdown: |
  RocketMqConsumerLagHigh 消费堆积:

  1 rocketmq_inspect:
  mq_topic_stats：Topic 路由、队列数；优先用 labels 里 topic。
  mq_consumer_status：consumerGroup 必填，用 labels 里的 group；没有则据 ${application} 推断并在 FINAL 说明假设。
  看 lag、消费 TPS、重试。

  2 指标 metrics_ops:
  business_metrics：Broker、消费延迟相关 exporter。

  3 消费者实例:
  nacos_list_instances：健康实例数是否下降。
  docker_logs：消费线程 OOM、频繁 rebalance。

  4 日志 elasticsearch_ops:
  ConsumeMessage、RECONSUME、timeout；对齐堆积开始时间。

  5 FINAL:
  根因：消费慢、缩容、Broker 热点、下游拖慢；扩容消费者、优化逻辑、限流建议。

steps:
  - type: delegate_subagent
    sub-agent-id: rocketmq_inspect
    task: |
      告警 RocketMqConsumerLagHigh。
      topic=${topic}，consumerGroup=${consumerGroup}，主服务优先看 ${primaryService}。
      依次查询 mq_topic_stats、mq_consumer_status，必要时 mq_dead_letter，输出堆积位置、消费 TPS、重试与 DLQ 线索。
    context: {}
  - type: delegate_subagent
    sub-agent-id: nacos_config
    task: |
      告警 RocketMqConsumerLagHigh。
      查看 ${primaryService} 的实例数、健康状态和注册情况，判断是否因缩容或实例异常导致消费掉队。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 RocketMqConsumerLagHigh。
      检索服务 ${primaryService} 与 topic=${topic}、group=${consumerGroup} 相关的消费超时、重试、异常样本。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 RocketMqConsumerLagHigh。
      查看 RocketMQ exporter 与服务 ${primaryService} 的业务指标，判断 lag 是否伴随 RT、线程池或错误率升高。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: mysql_inspect
    task: |
      告警 RocketMqConsumerLagHigh。
      若消费者 ${primaryService} 最终落库或查库，排查 MySQL 慢查询/锁等待是否拖慢消费。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: redis_inspect
    task: |
      告警 RocketMqConsumerLagHigh。
      若消费者 ${primaryService} 依赖 Redis，排查 Redis 慢命令或阻塞是否导致消费耗时增加。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 RocketMqConsumerLagHigh。
      查看 ${primaryService} 消费容器的资源、日志和重启情况。
    on-error: continue
