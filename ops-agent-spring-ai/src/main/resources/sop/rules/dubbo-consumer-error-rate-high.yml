# category: dubbo
match-alertname: DubboConsumerErrorRateHigh
match-category: dubbo
sop-markdown: |
  DubboConsumerErrorRateHigh Consumer 错误率高:

  1 指标 metrics_ops:
  business_metrics 查询 consumer 侧失败率，重点看 application_name、interface、method 是否集中在单一下游接口。

  2 下游可用性:
  用 nacos_config 查询告警 labels.interface 对应 provider 服务是否有健康实例；若无法从 interface 推断服务名，在 FINAL 写明。

  3 日志 elasticsearch_ops:
  查 consumer 侧 No provider、timeout、network、codec、serialization、RpcException。

  4 依赖:
  如果 provider 存在但 RT 同步升高，结合 provider 日志和 MySQL/Redis/MQ 证据继续排查。

  5 FINAL:
  区分无 provider、网络/注册、provider 慢、业务异常；给出证据和责任服务。

steps:
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 DubboConsumerErrorRateHigh。
      围绕主服务 ${primaryService} 查询 consumer 侧失败率、QPS、interface、method，判断错误是否集中在单一下游接口。
  - type: delegate_subagent
    sub-agent-id: nacos_config
    task: |
      告警 DubboConsumerErrorRateHigh。
      查询 ${primaryService} 及相关 Dubbo provider 的 Nacos 实例状态，确认无 provider、实例数下降、注册 IP/端口异常。
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 DubboConsumerErrorRateHigh。
      检索 ${primaryService} 的 No provider、timeout、network、codec、serialization、RpcException 日志，输出最相关异常样本。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 DubboConsumerErrorRateHigh。
      查看 ${primaryService} 容器是否存在、资源是否异常、是否有重启或关键错误日志。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: mysql_inspect
    task: |
      告警 DubboConsumerErrorRateHigh。
      仅当前面日志或指标指向 DB 依赖时，排查慢查询、锁等待、连接占用是否导致 consumer 调用失败。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: redis_inspect
    task: |
      告警 DubboConsumerErrorRateHigh。
      仅当前面日志或指标指向 Redis 依赖时，排查慢命令、阻塞客户端和连接问题。
    on-error: continue
