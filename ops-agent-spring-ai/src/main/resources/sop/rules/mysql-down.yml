# category: mysql
match-alertname: MySqlDown
match-category: mysql
sop-markdown: |
  MySqlDown MySQL 探测失败:

  1 指标 metrics_ops:
  business_metrics：mysqld_exporter 或 up；区分 DB 真挂还是采集失败。

  2 mysql_inspect:
  若仍能连：mysql_status 看只读、连接拒绝。mysql_processlist：锁表、备份导致探针超时。

  3 基础设施 docker_ops:
  数据库容器或主机：docker_logs。

  4 nacos_config:
  应用数据源 host 是否变更；只读。

  5 日志 elasticsearch_ops:
  Communications link failure 大面积出现时间。

  6 FINAL:
  主从切换、宕机、网络、误告警；RTO 与升级路径。

steps:
  - type: delegate_subagent
    sub-agent-id: metrics_ops
    task: |
      告警 MySqlDown。
      先判断 mysqld_exporter、业务侧 up 和错误率，区分 DB 真挂、网络问题还是采集异常。
  - type: delegate_subagent
    sub-agent-id: mysql_inspect
    task: |
      告警 MySqlDown。
      若仍可连通，查询 global status、processlist，判断只读、连接拒绝、长事务或锁表问题。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: elasticsearch_ops
    task: |
      告警 MySqlDown。
      查询 Communications link failure、连接超时、拒绝连接日志，归因影响最大的业务服务。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: nacos_config
    task: |
      告警 MySqlDown。
      查询 ${primaryService} 或候选服务 ${candidateServices} 的数据源配置，只读确认 host、端口、账号是否变更。
    on-error: continue
  - type: delegate_subagent
    sub-agent-id: docker_ops
    task: |
      告警 MySqlDown。
      查看 MySQL 容器/宿主机日志和资源使用，确认进程退出、磁盘满或节点异常。
    on-error: continue
