server:
  port: 8096

spring:
  application:
    name: ops-agent-spring-ai
  web:
    resources:
      cache:
        period: 0
  config:
    import: optional:file:./application-local.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        group: DEFAULT_GROUP
        locator:
          enabled: true
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        import-check:
          enabled: false
  ai:
    dashscope:
      api-key: sk-835213ff585445e483b827cdcb22cdbc
      chat:
        options:
          model: qwen-max

ops-ai:
  otlp:
    enabled: ${OPS_AI_OTLP_ENABLED:false}
    endpoint: ${OPS_AI_OTLP_ENDPOINT:http://127.0.0.1:11800}
    service-name: ${OPS_AI_OTLP_SERVICE_NAME:yue-ops-agent}
    timeout-seconds: 10
  alert:
    mode: deterministic
  react:
    max-parent-iters: 6
    max-sub-iters: 4
  chat:
    mode: simple
  elasticsearch:
    base-url: ${OPS_AI_ELASTICSEARCH_BASE_URL:http://127.0.0.1:9200}
    username: ${OPS_AI_ELASTICSEARCH_USERNAME:}
    password: ${OPS_AI_ELASTICSEARCH_PASSWORD:}
    skywalking:
      base-url: ${OPS_AI_SKYWALKING_ES_URL:}
      username: ${OPS_AI_SKYWALKING_ES_USERNAME:}
      password: ${OPS_AI_SKYWALKING_ES_PASSWORD:}
  prometheus:
    base-url: ${OPS_AI_PROMETHEUS_BASE_URL:http://127.0.0.1:9090}
  nacos:
    server-addr: ${OPS_AI_NACOS_SERVER_ADDR:127.0.0.1:8848}
    namespace: ${OPS_AI_NACOS_NAMESPACE:}
    username: ${OPS_AI_NACOS_USERNAME:}
    password: ${OPS_AI_NACOS_PASSWORD:}
  docker:
    host: ${OPS_AI_DOCKER_HOST:unix:///var/run/docker.sock}
    api-version: ${OPS_AI_DOCKER_API_VERSION:}
  mysql:
    jdbc-url: ${OPS_AI_MYSQL_JDBC_URL:jdbc:mysql://127.0.0.1:3306/mysql?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${OPS_AI_MYSQL_USERNAME:root}
    password: ${OPS_AI_MYSQL_PASSWORD:}
  history:
    enabled: ${OPS_AI_HISTORY_ENABLED:true}
    jdbc-url: ${OPS_AI_HISTORY_JDBC_URL:jdbc:mysql://127.0.0.1:3306/ops_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${OPS_AI_HISTORY_USERNAME:root}
    password: ${OPS_AI_HISTORY_PASSWORD:}
    table-name: ${OPS_AI_HISTORY_TABLE_NAME:ops_run_summary}
  rocketmq:
    name-server: ${OPS_AI_ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
    enabled: ${OPS_AI_ROCKETMQ_ENABLED:false}
  redis:
    uri: ${OPS_AI_REDIS_URI:}
    host: ${OPS_AI_REDIS_HOST:127.0.0.1}
    port: ${OPS_AI_REDIS_PORT:6379}
    password: ${OPS_AI_REDIS_PASSWORD:}
    database: ${OPS_AI_REDIS_DATABASE:0}
  sop:
    rules-dir: classpath:sop/rules/
  catalog:
    location: classpath:ops-catalog/catalog.json

logstash:
  enabled: ${LOGSTASH_ENABLED:false}
  host: ${LOGSTASH_HOST:127.0.0.1}
  port: ${LOGSTASH_PORT:4560}

yue:
  log:
    trace:
      provider: skywalking
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
