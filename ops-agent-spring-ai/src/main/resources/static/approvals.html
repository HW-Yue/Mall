<body data-page="approvals">
    <header class="shell-header">
        <div class="brand">
            <div class="brand-mark">YA</div>
            <div>
                <h1>Yue Ops Agent</h1>
                <p class="brand-tagline" title="能力说明">SOP 匹配 · 工具编排 · 审批与追踪</p>
            </div>
        </div>
        <div class="header-actions">
            <nav class="shell-nav" aria-label="页面导航">

    <div id="toast" class="toast" role="status"></div>
