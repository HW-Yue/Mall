<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运行历史 · Yue Ops Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=20260507-1700">
    <link rel="stylesheet" href="css/runs.css?v=20260507-1700">
</head>
<body data-page="runs">
    <header class="shell-header">
        <div class="brand">
            <div class="brand-mark">YA</div>
            <div>
                <h1>Yue Ops Agent</h1>
                <p class="brand-tagline" title="能力说明">SOP 匹配 · 工具编排 · 审批与追踪</p>
            </div>
        </div>
        <div class="header-actions">
            <nav class="shell-nav" aria-label="页面导航">
                <a class="nav-link" href="index.html" data-page-link="workbench">运行工作台</a>
                <a class="nav-link" href="runs.html" data-page-link="runs">运行历史</a>
                <a class="nav-link" href="approvals.html" data-page-link="approvals">审批队列</a>
                <a class="nav-link" href="tools.html" data-page-link="tools">工具调用</a>
            </nav>
            <div class="connection" id="api-chip">
                <span class="status-dot"></span>
                <span id="api-text">连接中</span>
            </div>
        </div>
    </header>

    <main class="runs-page">
        <section class="runs-list-panel panel">
            <div class="panel-head compact">
                <div>
                    <h2>运行历史 <span class="approval-count" id="runs-count">0</span></h2>
                    <p>来自 Elasticsearch（logstash 索引），按 runId 聚合最近的运行。</p>
                </div>
                <div class="runs-toolbar">
                    <input type="text" id="run-id-input" class="runs-input" placeholder="按 runId 直接查询" />
                    <button type="button" class="btn secondary" id="runs-refresh">刷新</button>
                </div>
            </div>
            <div class="runs-list" id="runs-list"></div>
        </section>

        <section class="runs-detail-panel panel">
            <div class="panel-head compact">
                <div>
                    <h2>Timeline <span class="run-id-chip" id="active-run-id">未选中</span></h2>
                    <p>事件按 @timestamp 升序，data 字段渲染为可折叠 JSON。</p>
                </div>
                <div id="timeline-meta" class="timeline-meta"></div>
            </div>
            <div class="timeline" id="timeline"></div>
        </section>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script src="config.js?v=20260507-1700"></script>
    <script src="js/runs.js?v=20260507-1700"></script>
    <script src="js/app.js?v=20260507-1700"></script>
</body>
</html>
