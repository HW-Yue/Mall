# 单元/集成测试不连 Nacos / Logstash，避免本地与 CI 无外部依赖时失败
logstash:
  enabled: false

spring:
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
      config:
        enabled: false
        import-check:
          enabled: false

yue:
  log:
    trace:
      provider: skywalking
