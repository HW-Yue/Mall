server:
  port: 8094
  tomcat:
    accept-count: 2000
    max-connections: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  config:
    import:
      - classpath:nacos/seckill-service-dtp-dev.yml
      - optional:nacos:seckill-service-dtp-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:seckill-service-datasource-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - classpath:nacos/seckill-service-mq-dev.yml
      - optional:nacos:seckill-service-mq-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/test_seckill_service?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Seckill_HikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 180000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 3000ms
      client-name: seckill-redisson
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://redis:6379"
          database: 0
          clientName: seckill-redisson
          connectionPoolSize: 100
          connectionMinimumIdleSize: 10
          idleConnectionTimeout: 30000
          pingConnectionInterval: 60000
          retryAttempts: 3
          retryInterval: 1000
          connectTimeout: 5000
          timeout: 3000
          keepAlive: true
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        import-check:
          enabled: false
    sentinel:
      eager: true
      transport:
        dashboard: sentinel-dashboard:8858
        port: 8722
      datasource:
        flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-flow-rules.json
            groupId: SENTINEL_GROUP
            rule-type: flow
            data-type: json
        degrade:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-degrade-rules.json
            groupId: SENTINEL_GROUP
            rule-type: degrade
            data-type: json
        param-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-param-flow-rules.json
            groupId: SENTINEL_GROUP
            rule-type: param-flow
            data-type: json
        system:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-system-rules.json
            groupId: SENTINEL_GROUP
            rule-type: system
            data-type: json
        authority:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-authority-rules.json
            groupId: SENTINEL_GROUP
            rule-type: authority
            data-type: json

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml

rocketmq:
  name-server: rmq-namesrv:9876
  producer:
    group: seckill-service-producer
    send-message-timeout: 3000

app:
  rocketmq:
    topic:
      seckillOrderCreate: seckill-order-create
      orderPaidSeckill: order-paid-seckill
      orderCloseSeckill: order-close-seckill
      seckillStockDeduct: seckill-stock-deduct
      payRefundSeckill: pay-refund-seckill
    consumerGroup:
      seckillOrderCreate: CG_SECKILL_ORDER_CREATE
      orderPaidSeckill: CG_ORDER_PAID_SECKILL
      orderCloseSeckill: CG_ORDER_CLOSE_SECKILL_MARKET
      seckillStockDeduct: CG_SECKILL_STOCK_DEDUCT
      payRefundSeckill: CG_SECKILL_PAY_REFUND

logstash:
  enabled: true
  host: logstash
  port: 4560

logging:
  level:
    com.yue.seckill: info

yue:
  log:
    trace:
      provider: skywalking

dubbo:
  application:
    # Dubbo 用独立 service-name，避免与 Spring Cloud 同名导致 gateway 把 HTTP 请求路由到 Triple 端口
    name: ${spring.application.name}-dubbo
  registry:
    address: nacos://nacos:8848
    register-mode: instance
  protocol:
    name: tri
    port: 20883
  consumer:
    timeout: 5000
    retries: 2
    check: false
