<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Ops · 运维 Agent</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="top-bar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2 3 7v6c0 5 3.8 9 9 10 5.2-1 9-5 9-10V7l-9-5Z"/>
                    <path d="m9 12 2 2 4-4"/>
                </svg>
            </div>
            <div class="brand-text">
                <div class="brand-title">Nexus Ops</div>
                <div class="brand-subtitle">运维 Agent 控制台</div>
            </div>
        </div>

        <nav class="tabs" role="tablist">
            <button class="tab active" data-view="chat" role="tab">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>
                </svg>
                <span>对话</span>
            </button>
            <button class="tab" data-view="inbox" role="tab">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
                    <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/>
                </svg>
                <span>审批收件箱</span>
                <span class="tab-badge" id="pending-badge" hidden>0</span>
            </button>
        </nav>

        <div class="top-meta">
            <div class="api-chip" id="api-chip" title="点击可通过 ?api=... 或 localStorage 修改后端地址">
                <span class="dot" id="api-dot"></span>
                <span id="api-text">…</span>
            </div>
        </div>
    </header>

    <main class="workspace">
        <!-- ================= 对话视图 ================= -->
        <section class="view view-chat active" id="view-chat" role="tabpanel">
            <div class="chat-wrap">
                <div class="chat-hero">
                    <h2>你好，指挥官 👋</h2>
                    <p>当前对话连通的是 <code>NacosManagerAgent</code>，可以读取 / 发布 Nacos 配置、查看服务实例。后续将替换为带 MCP &amp; Skill 的通用 Agent。</p>
                    <div class="chat-quickrow">
                        <button class="chip" data-prompt="列出 mall 服务在 Nacos 里的全部 dataId。">列 mall dataId</button>
                        <button class="chip" data-prompt="读取 dataId=mall-flow-rules.json 的内容并解释每条规则的意义。">读 mall-flow-rules.json</button>
                        <button class="chip" data-prompt="查看服务名为 order 的所有实例。">查 order 实例</button>
                        <button class="chip ghost" id="chat-clear">新对话</button>
                    </div>
                </div>

                <div class="chat-messages" id="messages"></div>

                <form class="chat-composer" id="composer">
                    <textarea
                        id="input"
                        rows="1"
                        placeholder="输入指令，例如：把 mall 商品查询 QPS 从 500 调到 800…   ( Enter 发送，Shift+Enter 换行 )"
                        autocomplete="off"></textarea>
                    <div class="composer-actions">
                        <button type="button" class="btn ghost" id="stop-btn" hidden>
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                            <span>停止</span>
                        </button>
                        <button type="submit" class="btn primary" id="send-btn">
                            <span>发送</span>
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14"/>
                                <path d="m12 5 7 7-7 7"/>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- ================= 审批收件箱视图 ================= -->
        <section class="view view-inbox" id="view-inbox" role="tabpanel">
            <aside class="inbox-side">
                <div class="filters">
                    <div class="filter-group">
                        <div class="filter-label">状态</div>
                        <div class="filter-row">
                            <button class="pill active" data-status="PENDING">待审批</button>
                            <button class="pill" data-status="">全部</button>
                            <button class="pill" data-status="APPLIED">已生效</button>
                            <button class="pill" data-status="REJECTED">已拒绝</button>
                            <button class="pill" data-status="FAILED">失败</button>
                            <button class="pill" data-status="EXPIRED">过期</button>
                        </div>
                    </div>
                    <div class="filter-group">
                        <div class="filter-label">域</div>
                        <div class="filter-row">
                            <button class="pill domain-btn active" data-domain="">全部</button>
                            <button class="pill domain-btn" data-domain="sentinel">Sentinel</button>
                            <button class="pill domain-btn" data-domain="dtp">DTP</button>
                            <button class="pill domain-btn" data-domain="notify">Notify</button>
                        </div>
                    </div>
                </div>
                <div class="task-list" id="task-list"></div>
            </aside>
            <section class="inbox-detail" id="detail">
                <div class="empty-state">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
                            <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/>
                        </svg>
                    </div>
                    <div class="empty-title">请选择一个审批任务</div>
                    <div class="empty-desc">Prometheus 告警触发的 Nacos 变更方案会出现在左侧，待你拍板。</div>
                </div>
            </section>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="config.js"></script>
    <script src="js/agui-client.js"></script>
    <script src="js/inbox.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
