server:
  port: 8092

# Actuator：供 Prometheus 抓取 /actuator/prometheus（与 Docker 内 Prometheus + Nacos SD 对接）
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: order-service
  config:
    import:
      - classpath:nacos/order-service-dtp-dev.yml
      - optional:nacos:order-service-dtp-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:order-service-datasource-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - classpath:nacos/order-service-mq-dev.yml
      - optional:nacos:order-service-mq-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: 100.86.250.112:8848
        locator:
          enabled: true
        ip: 100.86.250.112
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        import-check:
          enabled: false
    # Sentinel：流控/熔断/降级；规则以 Nacos 为源，动态生效
    sentinel:
      eager: true
      transport:
        dashboard: 100.86.250.112:8858
        port: 8720           # 与 mall(8724) 等错开，避免同机冲突
      datasource:
        flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-flow-rules.json
            groupId: SENTINEL_GROUP
            rule-type: flow
            data-type: json
        degrade:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-degrade-rules.json
            groupId: SENTINEL_GROUP
            rule-type: degrade
            data-type: json
        param-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-param-flow-rules.json
            groupId: SENTINEL_GROUP
            rule-type: param-flow
            data-type: json
        system:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-system-rules.json
            groupId: SENTINEL_GROUP
            rule-type: system
            data-type: json
        authority:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-authority-rules.json
            groupId: SENTINEL_GROUP
            rule-type: authority
            data-type: json
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://100.86.250.112:13306/order_service?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true&sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES'
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Order_HikariCP
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  # Redis：统一用官方 redisson-spring-boot-starter；Redisson 的 connection factory 会覆盖 Lettuce，
  # 业务里 StringRedisTemplate / RedisTemplate 自动走同一套连接池。clientName 供 redis_exporter 反查。
  data:
    redis:
      host: 100.86.250.112
      port: 16379
      database: 0
      timeout: 3000ms
      client-name: order-redisson
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://100.86.250.112:16379"
          database: 0
          clientName: order-redisson
          connectionPoolSize: 20
          connectionMinimumIdleSize: 5
          idleConnectionTimeout: 30000
          pingConnectionInterval: 60000
          retryAttempts: 3
          retryInterval: 1000
          connectTimeout: 5000
          timeout: 3000
          keepAlive: true

# RocketMQ（缺省或连不上时：SeckillOrderCreateListener / NormalOrderCreateListener / NormalOrderPendingPublisher 不生效，
# 秒杀 seckill-wait 轮询无 orderId、普通品 create_normal_order 入队失败。联调前请启 name-server:9876 并建 Topic）
rocketmq:
  name-server: 100.86.250.112:9876
  producer:
    group: order-service-producer
    send-message-timeout: 3000

# 业务 Topic 配置
app:
  order:
    # 为 false 时禁止直连 create_order 创建 normal 单（应走 mall）
    allow-direct-normal-create-order: true
    get-pay-url-pending-retries: 6
    get-pay-url-pending-wait-ms: 50
    # 与 mall 同值时可校验 create_order_normal_from_mall
    internal-create-token: ""
  rocketmq:
    topic:
      # 消费（来自 pay-service）
      paySuccessNormal: pay-success-normal
      paySuccessGroupBuy: pay-success-group-buy
      paySuccessSeckill: pay-success-seckill
      orderCloseNormal: order-close-normal
      orderCloseGroupBuy: order-close-group-buy
      orderCloseSeckill: order-close-seckill
      payRefundNormal: pay-refund-normal
      payRefundGroupBuy: pay-refund-group-buy
      payRefundSeckill: pay-refund-seckill
      payRefundNormalResult: pay-refund-normal-result
      payRefundGroupBuyResult: pay-refund-group-buy-result
      payRefundSeckillResult: pay-refund-seckill-result
      groupBuySuccessNotify: group-buy-success-notify
      # 发布（下游消费）
      orderPaidNormal: order-paid-normal
      orderPaidGroupBuy: order-paid-group_buy
      orderPaidSeckill: order-paid-seckill
      orderShipTask: order-ship-task
      # 消费（来自 seckill-service，异步建单）
      seckillOrderCreate: seckill-order-create
      # 生产 / 自消费：普通商品 mall 已锁库后异步 INSERT
      normalOrderCreate: normal-order-create
    consumerGroup:
      paySuccessNormal: CG_PAY_SUCCESS_NORMAL
      paySuccessGroupBuy: CG_PAY_SUCCESS_GROUP_BUY
      paySuccessSeckill: CG_PAY_SUCCESS_SECKILL
      orderCloseNormal: CG_ORDER_CLOSE_NORMAL
      orderCloseGroupBuy: CG_ORDER_CLOSE_GROUP_BUY
      orderCloseSeckill: CG_ORDER_CLOSE_SECKILL
      payRefundNormal: CG_PAY_REFUND_NORMAL
      payRefundGroupBuy: CG_PAY_REFUND_GROUP_BUY
      payRefundSeckill: CG_PAY_REFUND_SECKILL
      payRefundNormalResult: CG_PAY_REFUND_NORMAL_RESULT
      payRefundGroupBuyResult: CG_PAY_REFUND_GROUP_BUY_RESULT
      payRefundSeckillResult: CG_PAY_REFUND_SECKILL_RESULT
      groupBuySuccessNotify: CG_GROUP_BUY_SUCCESS_NOTIFY
      orderShipTask: CG_ORDER_SHIP_TASK
      seckillOrderCreate: CG_SECKILL_ORDER_CREATE_ORDER
      normalOrderCreate: CG_NORMAL_ORDER_CREATE

# MyBatis
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
    com.yue.order: debug

# 日志上报 ELK
logstash:
  enabled: true
  host: 100.86.250.112
  port: 4560

# SkyWalking 本地/IDEA 联调；JVM 见 .run/ 与 dev-tools/skywalking/README.md
yue:
  log:
    trace:
      provider: skywalking
