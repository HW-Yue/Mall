server:
  port: 8092

spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        locator:
          enabled: true
        ip: 100.67.209.67
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://localhost:13306/order_service?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true&sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES'
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
  redis:
    host: localhost
    port: 16379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        min-idle: 5
        max-idle: 10
        max-active: 20
  hikari:
    pool-name: Order_HikariCP
    minimum-idle: 5
    idle-timeout: 180000
    maximum-pool-size: 10
    auto-commit: true
    max-lifetime: 1800000
    connection-timeout: 30000
    connection-test-query: SELECT 1

# RocketMQ
rocketmq:
  name-server: localhost:9876
  producer:
    group: order-service-producer
    send-message-timeout: 3000

# 业务 Topic 配置
app:
  rocketmq:
    topic:
      # 消费（来自 pay-service）
      paySuccessNormal: pay-success-normal
      paySuccessGroupBuy: pay-success-group-buy
      paySuccessSeckill: pay-success-seckill
      # 发布（下游消费）
      orderPaidNormal: order-paid-normal
      orderPaidGroupBuy: order-paid-group_buy
      orderPaidSeckill: order-paid-seckill
      # 消费（来自 seckill-service，异步建单）
      seckillOrderCreate: seckill-order-create
    consumerGroup:
      paySuccessNormal: CG_PAY_SUCCESS_NORMAL
      paySuccessGroupBuy: CG_PAY_SUCCESS_GROUP_BUY
      paySuccessSeckill: CG_PAY_SUCCESS_SECKILL
      seckillOrderCreate: CG_SECKILL_ORDER_CREATE_ORDER

# MyBatis
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
    com.yue.order: debug

# 日志上报 ELK
logstash:
  host: 127.0.0.1
