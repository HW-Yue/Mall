server:
  port: 8090

spring:
  application:
    name: springcloud-gateway
  cloud:
    nacos:
      discovery:
        ip: 127.0.0.1
        server-addr: 127.0.0.1:8848
        locator:
          enabled: true
      config:
        import-check:
          enabled: false
    # Sentinel Gateway：针对网关路由做接口分组限流
    # Dashboard 上会自动出现「xfg-dev-tech-springcloud-gateway」，并识别所有 Route
    # 动态规则：Nacos 中编辑
    #   - xfg-dev-tech-springcloud-gateway-gw-flow-rules.json   （GatewayFlowRule 集合）
    #   - xfg-dev-tech-springcloud-gateway-gw-api-rules.json    （ApiDefinition 接口分组，可选）
    sentinel:
      eager: true
      filter:
        # Spring Cloud Gateway 使用专用过滤器，关掉默认的 Servlet CommonFilter 以避免冲突
        enabled: false
      transport:
        dashboard: 127.0.0.1:8858
        port: 8718
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":"429","info":"Blocked by Sentinel(gateway)"}'
      datasource:
        gw-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-gw-flow-rules.json
            groupId: SENTINEL_GROUP
            rule-type: gw-flow
            data-type: json
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: 1
          uri: lb://mall
          order: 1
          predicates:
            - Path=/gw/api/v1/mall/**
          filters:
            - StripPrefix=1
#            - name: RequestRateLimiter
#              args:
#                key-resolver: "#{@ipKeyResolver}" # 限流方式：Bean名称
#                redis-rate-limiter.replenishRate: 1 # 生成令牌速率：个/秒
#                redis-rate-limiter.burstCapacity: 3 # 令牌桶容量
#                redis-rate-limiter.requestedTokens: 1 # 每次消费的Token数量
        - id: 2
          uri: lb://login-pay
          order: 1
          predicates:
            - Path=/gw/api/v1/login-pay/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: lb://order-service
          order: 1
          predicates:
            - Path=/gw/api/v1/order/**
          filters:
            - StripPrefix=1
        - id: group-buy-service
          uri: lb://group-buy-service
          order: 1
          predicates:
            - Path=/gw/api/v1/group-buy/**
          filters:
            - StripPrefix=1
        - id: seckill-service
          uri: lb://seckill-service
          order: 1
          predicates:
            - Path=/gw/api/v1/seckill/**
          filters:
            - StripPrefix=1
      # 网关连接池配置（防止压测时连接耗尽）
      httpclient:
        connect-timeout: 5000
        response-timeout: 60s
        pool:
          type: elastic
          max-connections: 10000
          max-life-time: 60s
          eviction-interval: 30s

logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# 日志上报 ELK
logstash:
  enabled: true
  host: 127.0.0.1
  port: 4560

# 监控配置：暴露 /actuator/prometheus 供 Prometheus 抓取
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
