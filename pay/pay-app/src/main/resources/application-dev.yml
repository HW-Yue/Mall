server:
  port: 8095

# Actuator：供 Prometheus 抓取 /actuator/prometheus（与 Docker 内 Prometheus + Nacos SD 对接）
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# 应用配置
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'
    # SC 渠道配置 - 拼团对接渠道值、回调通知
    group-buy-market:
      api-url: http://100.86.250.112:8091

      source: s01
      chanel: c01
    no-market:
      api-url: http://100.86.250.112:8091

      source: s01
      chanel: c01

# 数据库配置；启动时配置数据库资源信息
spring:
  application:
    name: pay-service
  config:
    import:
      - classpath:nacos/pay-service-dtp-dev.yml
      - optional:nacos:pay-service-dtp-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - classpath:nacos/pay-service-runtime-dev.yml
      - optional:nacos:pay-service-runtime-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:pay-service-datasource-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - classpath:nacos/pay-service-mq-dev.yml
      - optional:nacos:pay-service-mq-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        ip: 100.86.250.112
        server-addr: 100.86.250.112:8848
        locator:
          enabled: true
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        import-check:
          enabled: false
    # Sentinel：支付宝回调 + 创建支付 URL 是外部网关类强依赖接口，必须有熔断保护
    sentinel:
      eager: true
      transport:
        dashboard: 100.86.250.112:8858
        port: 8723
      datasource:
        flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-flow-rules.json
            groupId: SENTINEL_GROUP
            rule-type: flow
            data-type: json
        degrade:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-degrade-rules.json
            groupId: SENTINEL_GROUP
            rule-type: degrade
            data-type: json
        param-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-param-flow-rules.json
            groupId: SENTINEL_GROUP
            rule-type: param-flow
            data-type: json
        system:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-system-rules.json
            groupId: SENTINEL_GROUP
            rule-type: system
            data-type: json
        authority:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: ${spring.application.name}-authority-rules.json
            groupId: SENTINEL_GROUP
            rule-type: authority
            data-type: json
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://100.86.250.112:13306/s-pay-mall-ddd-market?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Pay_HikariCP
      minimum-idle: 15 #最小空闲连接数量
      idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
      maximum-pool-size: 25 #连接池最大连接数，默认是10
      auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
      max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
      connection-test-query: SELECT 1


