# Apache RocketMQ（生产环境请改为实际 NameServer 地址；前缀必须为 rocketmq，勿放在 spring 下）
rocketmq:
  name-server: 100.86.250.112:9876
  producer:
    group: alipay-producer
    send-message-timeout: 3000
  consumer:
    group: alipay-consumer
  topic:
    pay_success_normal: pay-success-normal
    pay_success_group_buy: pay-success-group-buy
    pay_success_seckill: pay-success-seckill
    order_close_normal: order-close-normal
    order_close_group_buy: order-close-group-buy
    order_close_seckill: order-close-seckill
    pay_refund_normal: pay-refund-normal
    pay_refund_group_buy: pay-refund-group-buy
    pay_refund_seckill: pay-refund-seckill
    pay_refund_normal_result: pay-refund-normal-result
    pay_refund_group_buy_result: pay-refund-group-buy-result
    pay_refund_seckill_result: pay-refund-seckill-result
  consumerGroup:
    payRefundNormal: CG_PAY_PAY_REFUND_NORMAL
    orderCloseNormal: CG_PAY_ORDER_CLOSE_NORMAL
    orderCloseGroupBuy: CG_PAY_ORDER_CLOSE_GROUP_BUY
    payRefundGroupBuy: CG_PAY_PAY_REFUND_GROUP_BUY
    orderCloseSeckill: CG_PAY_ORDER_CLOSE_SECKILL
    payRefundSeckill: CG_PAY_PAY_REFUND_SECKILL

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
